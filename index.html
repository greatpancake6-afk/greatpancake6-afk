  mapWorldTick(); // reconcile immediately: prune anything that expired while the app was closed
}

/* ---- Wild seed spawning: organic placement (never snapped to POIs), category-aware, timed & expiring ---- */
function addSpawnToState(key, lat, lon, kind){
  const now = Date.now();
  const spawn = { uid: 'spawn_'+(seedUid++), key, lat, lon, kind, spawnedAt: now, expiresAt: now + SEED_LIFESPAN_MS };
  state.mapSpawns.push(spawn);
  if(state.tab === 'map' && leafletMapInstance){ addSpawnMarker(spawn); updateRadarArrows(); }
  saveMapStateDebounced();
  return spawn;
}
// Ambient seeds pull ONLY from the "Both" (shop+map) category pool, weighted so commons are common
// — unless forcedTierKey is given (used for the guaranteed initial/bootstrap batch, which must be
// specifically common+both seeds per spec).
function spawnAmbientSeed(forcedTierKey){
  const player = getPlayerCoords();
  const tierKey = forcedTierKey || pickTier(AMBIENT_TIER_WEIGHTS);
  let key = pickSpeciesForCategoryTier('both', tierKey);
  if(!key) key = DEX_ORDER.find(k=> SEED_TYPES[k].category==='both'); // defensive fallback, should never trigger
  if(!key) return;
  const { lat, lon } = pickSafeSpawnPoint(player, 15, AMBIENT_RADIUS_M);
  addSpawnToState(key, lat, lon, 'ambient');
}
// Special timed seeds pull ONLY from the "Map Only" category pool — rarer tiers spawn less often.
// Special spawns reach further out (up to 1200m) to encourage a longer walk.
function spawnSpecialSeed(){
  const player = getPlayerCoords();
  const tierKey = pickTier(SPECIAL_TIER_WEIGHTS);
  let key = pickSpeciesForCategoryTier('map', tierKey);
  if(!key) key = DEX_ORDER.find(k=> SEED_TYPES[k].category==='map');
  if(!key) return;
  const { lat, lon } = pickSafeSpawnPoint(player, 40, SPECIAL_RADIUS_M);
  addSpawnToState(key, lat, lon, 'special');
  const type = SEED_TYPES[key];
  const label = type.rarityLabel.charAt(0) + type.rarityLabel.slice(1).toLowerCase();
  toast(`✨ A ${label} ${type.name} has sprouted nearby!`);
  sendLocalNotification('Flora', `A ${label} ${type.name} has sprouted nearby!`);
}
function pickSpeciesForCategoryTier(category, tierKey){
  const candidates = DEX_ORDER.filter(k=> SEED_TYPES[k].tierKey===tierKey && SEED_TYPES[k].category===category);
  if(!candidates.length) return null;
  return candidates[Math.floor(Math.random()*candidates.length)];
}
// BUG FIX: seeds "showing up from way too far away" — ambient seeds are only ever allowed to exist
// within AMBIENT_RADIUS_M (500m, strict) of the player's real position. This is what catches and
// corrects any seed that was originally spawned before a real GPS lock was available (using the
// DEMO_CENTER fallback) or that the player has since walked far away from: it's purged here and
// immediately replaced near wherever the player actually is now. Only runs once we trust the
// coordinates (a real 'granted' GPS fix), so it never fights the DEMO_CENTER fallback itself.
function relocateStaleAmbientSpawns(){
  if(state.mapLocation.status !== 'granted') return;
  const player = getPlayerCoords();
  const stale = state.mapSpawns.filter(s=> s.kind==='ambient'
    && haversineMeters(player.lat, player.lon, s.lat, s.lon) > AMBIENT_RADIUS_M);
  if(!stale.length) return;
  stale.forEach(s=>{ removeSpawnMarker(s.uid); });
  const staleUids = new Set(stale.map(s=>s.uid));
  state.mapSpawns = state.mapSpawns.filter(s=> !staleUids.has(s.uid));
}
// Keeps 2-3 ambient (common, "both"-pool) seeds alive within a strict 500m radius at all times.
// - A totally empty board (first load, or everything lost at once) refills its FULL target
//   instantly, guaranteed common+both species, so the player always sees exactly 2-3 seeds right
//   away — never just one instant spawn with the rest silently stuck behind a cooldown.
// - Losing a single seed out of an otherwise-populated board (collected, or expired on its own)
//   still queues a normal 20-30 min respawn cooldown, unchanged from before.
function ambientMaintenance(){
  if(!mapStateLoaded) return;
  relocateStaleAmbientSpawns();
  const now = Date.now();
  const stillPending = [];
  state.mapRespawnQueue.forEach(item=>{
    if(now >= item.readyAt) spawnAmbientSeed();
    else stillPending.push(item);
  });
  state.mapRespawnQueue = stillPending;
  const ambientActiveAtStart = state.mapSpawns.filter(s=>s.kind==='ambient').length;
  const boardWasEmpty = ambientActiveAtStart === 0 && state.mapRespawnQueue.length === 0;
  let deficit = state.ambientTargetCount - ambientActiveAtStart - state.mapRespawnQueue.length;
  while(deficit > 0){
    if(boardWasEmpty){
      spawnAmbientSeed('common'); // guaranteed initial batch: common tier, "both" category
    } else {
      state.mapRespawnQueue.push({ readyAt: now + randBetween(RESPAWN_COOLDOWN_MIN_MS, RESPAWN_COOLDOWN_MAX_MS) });
    }
    deficit--;
  }
  saveMapStateDebounced();
}
function maybeFireSpecialSpawn(){
  const now = Date.now();
  if(!state.nextSpecialSpawnAt){ state.nextSpecialSpawnAt = now + randBetween(SPECIAL_INTERVAL_MIN_MS, SPECIAL_INTERVAL_MAX_MS); }
  if(now >= state.nextSpecialSpawnAt){
    spawnSpecialSeed();
    // Reschedule from "now" (rather than drifting off the missed timestamp) so a long-closed
    // app doesn't fire a burst of catch-up notifications.
    state.nextSpecialSpawnAt = now + randBetween(SPECIAL_INTERVAL_MIN_MS, SPECIAL_INTERVAL_MAX_MS);
    saveMapStateDebounced();
  }
}
// Strict 12h lifespan — checked against Date.now() so time drift (app backgrounded, laptop
// asleep, clock changes) can never leave a stale seed on the map.
function pruneExpiredSpawns(){
  const now = Date.now();
  const expired = state.mapSpawns.filter(s=> s.expiresAt && now >= s.expiresAt);
  if(!expired.length) return;
  expired.forEach(s=> removeSpawnMarker(s.uid));
  state.mapSpawns = state.mapSpawns.filter(s=> !(s.expiresAt && now >= s.expiresAt));
  saveMapStateDebounced();
}
// Single world tick: expiration -> ambient upkeep -> special-event check -> refresh what's on screen.
function mapWorldTick(){
  try{
    if(!mapStateLoaded) return;
    pruneExpiredSpawns();
    ambientMaintenance();
    maybeFireSpecialSpawn();
    if(state.tab === 'map' && leafletMapInstance){ syncSpawnMarkers(); updateRadarArrows(); updateProximityState(); }
  }catch(e){ console.error('Flora map world-tick error:', e); }
}
function collectWildSpawn(uid){
  const idx = state.mapSpawns.findIndex(s=>s.uid===uid);
  if(idx === -1) return;
  const spawn = state.mapSpawns[idx];
  const player = getPlayerCoords();
  const d = haversineMeters(player.lat, player.lon, spawn.lat, spawn.lon);
  if(d > COLLECT_RADIUS_M + GPS_JITTER_BUFFER_M){
    toast(`🚶 Too far — you're about ${Math.round(d)}m away. Get within ${COLLECT_RADIUS_M}m!`);
    return;
  }
  const key = spawn.key;
  state.pouch.push({uid: seedUid++, type: key});
  state.mapSpawns.splice(idx, 1);
  removeSpawnMarker(uid);
  if(inRangeSpawnUid === uid){ inRangeSpawnUid = null; hideHarvestPrompt(); }
  if(spawn.kind === 'ambient') ambientMaintenance();
  updateRadarArrows();
  updateProximityState(); // another spawn may already be in range — surface it immediately
  saveMapStateDebounced();
  playSfx('coin');
  try{ if(navigator.vibrate) navigator.vibrate([30,40,30]); }catch(e){ /* haptics unsupported, ignore */ }
  const isNew = checkDiscovery(key);
  if(isNew){ state.modal = 'newSpecies'; state.celebrateSpecies = key; render(); }
  else { showLeafToast(SEED_TYPES[key]); }
}

/* ---- Proximity collection: pulsing marker, slide-up harvest prompt, haptic on entering range ---- */
function showHarvestPrompt(spawn){
  const prompt = document.getElementById('harvestPrompt');
  const text = document.getElementById('harvestPromptText');
  if(!prompt) return;
  if(text) text.textContent = `Tap to Harvest ${SEED_TYPES[spawn.key].name}!`;
  prompt.classList.add('show');
}
function hideHarvestPrompt(){
  const prompt = document.getElementById('harvestPrompt');
  if(prompt) prompt.classList.remove('show');
}
function setMarkerInRange(uid, inRange){
  const marker = spawnMarkers[uid];
  const el = marker && marker.getElement ? marker.getElement() : null;
  if(!el) return;
  const mark = el.querySelector('.map-spawn-mark');
  if(mark) mark.classList.toggle('in-range', inRange);
}
// Finds the nearest spawn within COLLECT_RADIUS_M (if any) and syncs marker animation + the
// slide-up harvest button to it, firing a short haptic pulse only on the edge transition into range.
function updateProximityState(){
  if(!leafletMapInstance || state.tab !== 'map'){ if(inRangeSpawnUid){ inRangeSpawnUid = null; } hideHarvestPrompt(); return; }
  const player = getPlayerCoords();
  let nearest = null, nearestD = Infinity;
  state.mapSpawns.forEach(sp=>{
    const d = haversineMeters(player.lat, player.lon, sp.lat, sp.lon);
    if(d <= COLLECT_RADIUS_M && d < nearestD){ nearest = sp; nearestD = d; }
  });
  const newUid = nearest ? nearest.uid : null;
  if(newUid !== inRangeSpawnUid){
    if(inRangeSpawnUid) setMarkerInRange(inRangeSpawnUid, false);
    if(newUid){
      setMarkerInRange(newUid, true);
      showHarvestPrompt(nearest);
      try{ if(navigator.vibrate) navigator.vibrate(60); }catch(e){ /* haptics unsupported, ignore */ }
    } else {
      hideHarvestPrompt();
    }
    inRangeSpawnUid = newUid;
  } else if(newUid){
    // Same spawn still in range — re-apply the class in case syncSpawnMarkers rebuilt the marker.
    setMarkerInRange(newUid, true);
  }
}
// Cozy collection reward: leaf-particle burst + seed name, used for already-discovered finds.
// (Brand-new discoveries get the richer confetti "newSpecies" Dex-registration modal instead.)
function showLeafToast(type){
  const stack = document.getElementById('leafToastStack');
  if(!stack) return;
  while(stack.children.length >= 2){ stack.firstChild.remove(); }
  const el = document.createElement('div');
  el.className = 'leaf-toast';
  const leafEmojis = ['🍃','🌿','✨','🍀'];
  let particles = '';
  for(let i=0;i<6;i++){
    const angle = (Math.PI*2/6)*i + (Math.random()*0.5-0.25);
    const dist = 34 + Math.random()*22;
    const ex = Math.cos(angle)*dist, ey = Math.sin(angle)*dist - 10;
    const rot = Math.round(Math.random()*360 - 180);
    const emoji = leafEmojis[Math.floor(Math.random()*leafEmojis.length)];
    particles += `<span class="leaf-particle" style="--leaf-end:translate(${ex}px,${ey}px); --leaf-rot:${rot}deg; animation-delay:${(i*0.03).toFixed(2)}s;">${emoji}</span>`;
  }
  el.innerHTML = `${particles}<span class="leaf-toast-icon ${type.bg}">${seedIcon(type)}</span>
    <span class="leaf-toast-text"><span class="leaf-toast-title">${type.name}</span><span class="leaf-toast-sub">Added to pouch</span></span>`;
  stack.appendChild(el);
  setTimeout(()=> el.remove(), 2450);
}

/* ---- Off-screen radar: arrows pinned to the map edge pointing at seeds outside the 200m view ---- */
// Great-circle initial bearing (forward azimuth) from point 1 to point 2, in degrees clockwise
// from true north (0-360). This is the full, standard spherical bearing formula — every term is
// present and closed out; nothing here is abbreviated or left incomplete.
function computeBearing(lat1, lon1, lat2, lon2){
  if(![lat1, lon1, lat2, lon2].every(Number.isFinite)) return 0; // guard against bad/missing GPS data
  const toRad = deg => deg * Math.PI / 180;
  const phi1 = toRad(lat1);
  const phi2 = toRad(lat2);
  const deltaLon = toRad(lon2 - lon1);
  const y = Math.sin(deltaLon) * Math.cos(phi2);
  const x = (Math.cos(phi1) * Math.sin(phi2)) - (Math.sin(phi1) * Math.cos(phi2) * Math.cos(deltaLon));
  const thetaRad = Math.atan2(y, x);
  const thetaDeg = thetaRad * 180 / Math.PI;
  return (thetaDeg + 360) % 360;
}
// Finds where a ray from the center of a w×h box, travelling at compass bearing `bearingDeg`
// (0 = up/north, 90 = right/east, 180 = down/south, 270 = left/west — matching screen space
// exactly since the map is never rotated), intersects the box's edge (inset by `margin` px).
// Complete rectangle-ray intersection: handles every bearing, including the axis-aligned cases
// where dx or dy is exactly 0.
function edgePointForBearing(bearingDeg, w, h, margin){
  const rad = bearingDeg * Math.PI / 180;
  const dx = Math.sin(rad);
  const dy = -Math.cos(rad);
  const halfW = Math.max(w / 2 - margin, 1);
  const halfH = Math.max(h / 2 - margin, 1);
  const tX = dx !== 0 ? halfW / Math.abs(dx) : Infinity;
  const tY = dy !== 0 ? halfH / Math.abs(dy) : Infinity;
  const t = Math.min(tX, tY);
  return { x: (w / 2) + (dx * t), y: (h / 2) + (dy * t) };
}
// Location context for off-screen seeds: prefer a real nearby POI label (already fetched, free,
// instant); fall back to a throttled OpenStreetMap Nominatim reverse-geocode for a street/area
// name. Results are cached on the spawn itself (and persisted) so each spawn is only resolved once.
let nominatimQueue = Promise.resolve();
function nearestPOILabel(pt, maxM){
  let best = null, bestD = Infinity;
  state.mapPOIs.forEach(p=>{
    const d = haversineMeters(pt.lat, pt.lon, p.lat, p.lon);
    if(d < maxM && d < bestD){ best = p; bestD = d; }
  });
  return best ? best.label : null;
}
async function reverseGeocode(lat, lon){
  const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=17&addressdetails=1`;
  const ctrl = new AbortController();
  const timer = setTimeout(()=> ctrl.abort(), 6000);
  try{
    const res = await fetch(url, { signal: ctrl.signal, headers: {'Accept-Language':'en'} });
    clearTimeout(timer);
    if(!res.ok) throw new Error('Nominatim HTTP ' + res.status);
    const data = await res.json();
    const a = data.address || {};
    return a.road || a.pedestrian || a.footway || a.neighbourhood || a.suburb || a.hamlet || a.village || null;
  }catch(e){
    clearTimeout(timer);
    console.error('Flora reverse-geocode failed:', e);
    return null;
  }
}
function resolveSpawnLandmark(spawn){
  if(spawn.landmark || spawn.landmarkPending) return;
  const poiLabel = nearestPOILabel(spawn, 45);
  if(poiLabel){ spawn.landmark = poiLabel; saveMapStateDebounced(); return; }
  spawn.landmarkPending = true;
  // Nominatim's usage policy caps free reverse-geocoding at ~1 request/second, so every lookup is
  // serialized through this single queue rather than fired off in parallel per spawn.
  nominatimQueue = nominatimQueue.then(async ()=>{
    const label = await reverseGeocode(spawn.lat, spawn.lon);
    spawn.landmarkPending = false;
    spawn.landmark = label || 'a nearby spot';
    saveMapStateDebounced();
    if(state.tab === 'map' && leafletMapInstance) updateRadarArrows();
    await new Promise(r=> setTimeout(r, 1100));
  });
}
// Renders one edge-pinned directional arrow per off-screen seed, each pointing (via computeBearing,
// recomputed fresh from the player's current live coordinates every single call) toward its target,
// with distance and a real-world landmark/street name beneath it. Because this rebuilds its HTML
// from scratch on every call using getPlayerCoords() at call-time — never a cached/stale position —
// every arrow's rotation AND on-screen position both update together as the player physically walks.
// Fix: the radar distance labels used to be torn down and rebuilt from scratch on every call
// (via layer.innerHTML = ...), which made a smooth counter impossible — a brand new text node
// has no "previous value" to animate from. radarArrowEls keeps one persistent DOM node per
// off-screen spawn so its label can be stepped smoothly; radarMeterAnim tracks each label's
// currently-displayed value and in-flight timer.
let radarArrowEls = {};   // uid -> { wrap, shape, iconEl, label, landmark }
let radarMeterAnim = {};  // uid -> { current, timer }
const METER_STEP_MS = 40;        // how often the displayed number moves by 1
const METER_SNAP_THRESHOLD_M = 60; // jumps bigger than this (e.g. first paint) snap instantly instead of crawling
function stepMeterLabel(uid, el, targetValue){
  if(!el || !Number.isFinite(targetValue)) return;
  let anim = radarMeterAnim[uid];
  if(!anim){ anim = { current: targetValue, timer: null }; radarMeterAnim[uid] = anim; }
  if(Math.abs(anim.current - targetValue) > METER_SNAP_THRESHOLD_M) anim.current = targetValue;
  if(anim.timer) clearTimeout(anim.timer);
  const tick = ()=>{
    if(anim.current === targetValue){ el.textContent = anim.current + 'm'; anim.timer = null; return; }
    anim.current += anim.current < targetValue ? 1 : -1; // always a smooth single-unit step
    el.textContent = anim.current + 'm';
    anim.timer = setTimeout(tick, METER_STEP_MS);
  };
  tick();
}
function updateRadarArrows(){
  if(!leafletMapInstance) return;
  const layer = document.getElementById('radarLayer');
  const scene = document.querySelector('.map-scene');
  if(!layer || !scene) return;
  const w = scene.clientWidth, h = scene.clientHeight;
  if(!w || !h) return;
  const player = getPlayerCoords();
  if(!Number.isFinite(player.lat) || !Number.isFinite(player.lon)) return;
  const offScreen = state.mapSpawns.filter(s=> haversineMeters(player.lat, player.lon, s.lat, s.lon) > VIEWPORT_RADIUS_M);
  const liveUids = new Set(offScreen.map(s=>s.uid));
  // Remove arrows for spawns that are no longer off-screen / no longer active.
  Object.keys(radarArrowEls).forEach(uid=>{
    if(!liveUids.has(uid)){
      radarArrowEls[uid].wrap.remove();
      delete radarArrowEls[uid];
      if(radarMeterAnim[uid]){ if(radarMeterAnim[uid].timer) clearTimeout(radarMeterAnim[uid].timer); delete radarMeterAnim[uid]; }
    }
  });
  offScreen.forEach(spawn=>{
    const dist = Math.round(haversineMeters(player.lat, player.lon, spawn.lat, spawn.lon));
    const bearing = computeBearing(player.lat, player.lon, spawn.lat, spawn.lon);
    const { x, y } = edgePointForBearing(bearing, w, h, 26);
    const type = SEED_TYPES[spawn.key];
    const icon = type.tierKey==='common' ? '🌱' : type.tierKey==='uncommon' ? '🌸' : type.tierKey==='rare' ? '💜' : type.tierKey==='epic' ? '✨' : '👑';
    if(!spawn.landmark && !spawn.landmarkPending) resolveSpawnLandmark(spawn);
    const landmarkText = spawn.landmark || 'locating…';
    let entry = radarArrowEls[spawn.uid];
    if(!entry){
      const wrap = document.createElement('div');
      wrap.className = 'radar-arrow';
      wrap.dataset.spawn = spawn.uid;
      wrap.innerHTML = `<div class="radar-arrow-shape spawn-${type.tierKey}">`
        + `<span class="radar-arrow-tip"></span><span class="radar-arrow-icon">${icon}</span></div>`
        + `<div class="radar-arrow-label"></div><div class="radar-arrow-landmark"></div>`;
      wrap.addEventListener('click', ()=>{
        const p = getPlayerCoords();
        const s = state.mapSpawns.find(x=>x.uid===spawn.uid);
        if(s) toast(`🧭 ${SEED_TYPES[s.key].name} is about ${Math.round(haversineMeters(p.lat, p.lon, s.lat, s.lon))}m away, near ${s.landmark || 'you'}.`);
      });
      layer.appendChild(wrap);
      entry = {
        wrap,
        shape: wrap.querySelector('.radar-arrow-shape'),
        iconEl: wrap.querySelector('.radar-arrow-icon'),
        label: wrap.querySelector('.radar-arrow-label'),
        landmark: wrap.querySelector('.radar-arrow-landmark')
      };
      radarArrowEls[spawn.uid] = entry;
      radarMeterAnim[spawn.uid] = { current: dist, timer: null }; // first paint shows the exact value
      entry.label.textContent = dist + 'm';
    }
    entry.wrap.style.left = x + 'px';
    entry.wrap.style.top = y + 'px';
    entry.wrap.style.transform = 'translate(-50%,-50%)';
    entry.shape.style.transform = `rotate(${bearing}deg)`;
    if(entry.iconEl) entry.iconEl.style.transform = `rotate(${-bearing}deg)`;
    if(entry.landmark) entry.landmark.textContent = landmarkText;
    stepMeterLabel(spawn.uid, entry.label, dist);
  });
}

/* ---- Leaflet map lifecycle ---- */
async function initLeafletMap(){
  const myGeneration = ++mapGeneration;
  try{
    if(typeof L === 'undefined'){ console.error('Flora: Leaflet failed to load'); return; }
    const center = getPlayerCoords();
    leafletMapInstance = L.map('leafletMap', { zoomControl:false, attributionControl:true });
    // Camera is intentionally locked to the player -- no free panning or zooming.
    leafletMapInstance.dragging.disable();
    leafletMapInstance.touchZoom.disable();
    leafletMapInstance.doubleClickZoom.disable();
    leafletMapInstance.scrollWheelZoom.disable();
    leafletMapInstance.boxZoom.disable();
    leafletMapInstance.keyboard.disable();
    if(leafletMapInstance.tap) leafletMapInstance.tap.disable();
    // Voyager (not Positron/light_all) is used deliberately: it renders parks in soft pastel
    // green, water in soft blue, and roads with real width/casing out of the box — the
    // .leaflet-tile-pane filter above then just adds a light warm parchment wash on top,
    // instead of flattening the map into grayscale like the old Positron + heavy-sepia combo did.
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      maxZoom: 20, subdomains: 'abcd'
    }).addTo(leafletMapInstance);
    // Fit to a ~200m window around the player, regardless of container/screen size.
    leafletMapInstance.fitBounds(boundsForRadius(center, VIEWPORT_RADIUS_M), {animate:false});
    // Tiles can render blank/clipped if the container size wasn't final at init time.
    leafletMapInstance.invalidateSize();
    setTimeout(()=>{ if(leafletMapInstance){ leafletMapInstance.invalidateSize(); updateRadarArrows(); } }, 150);

    const playerIcon = L.divIcon({
      className:'',
      html:`<div class="map-player-wrap"><span class="map-player-pulse"></span><div class="map-player-arrow" style="transform:rotate(${deviceHeading}deg)"><svg width="26" height="26" viewBox="0 0 26 26"><path d="M13 2 L20 22 L13 17 L6 22 Z" fill="var(--moss)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></div></div>`,
      iconSize:[30,30]
    });
    playerMarker = L.marker([center.lat, center.lon], {icon: playerIcon, interactive:false}).addTo(leafletMapInstance);
    if(compassEnabled) attachCompassListener();

    spawnMarkers = {};
    state.mapSpawns.forEach(addSpawnMarker);
    updateRadarArrows();
    updateProximityState();
    if(mapStateLoaded) mapWorldTick(); // catch up on expiration/respawn immediately when opening the tab

    // Real OSM POIs (cafes/parks/buildings/restaurants) softly bias where new spawns land, and
    // are also shown as decorative context markers. Safety zones (schools/hospitals/residential)
    // are fetched in parallel and are NEVER shown — they only gate spawn placement, see
    // isSafeSpawnPoint(). Both cover the full 1200m special-spawn radius.
    const [pois, zones] = await Promise.all([ loadNearbyPOIs(center), fetchSafetyZones(center) ]);
    if(myGeneration !== mapGeneration || !leafletMapInstance) return; // player left the tab mid-fetch
    state.mapPOIs = pois;
    safetyZones = zones;
    lastPOIFetchCenter = center;
    poiMarkers = state.mapPOIs.map(poi=>{
      const icon = L.divIcon({ className:'', html:`<div class="map-poi-icon poi-${poi.type}"><span>${poi.icon}</span></div>`, iconSize:[30,30] });
      const m = L.marker([poi.lat, poi.lon], {icon}).addTo(leafletMapInstance);
      m.on('click', ()=> toast(`📍 ${poi.label}`));
      return m;
    });
  }catch(e){ console.error('Flora map init error:', e); }
}
function destroyLeafletMap(){
  mapGeneration++; // invalidates any in-flight OSM POI fetch from this session
  detachCompassListener();
  try{
    // NOTE: navigator.geolocation.watchPosition is intentionally NOT cleared here. It is a
    // global background tracker (started in requestLocation) that must keep running regardless
    // of which tab is active — clearing it here was the bug that froze location tracking every
    // time the player navigated away from the map.
    if(leafletMapInstance){ leafletMapInstance.remove(); leafletMapInstance = null; }
    Object.values(spawnMarkers).forEach(m=>{ try{ m.remove(); }catch(e){ /* map already torn down, nothing to clean up */ } });
    poiMarkers.forEach(m=>{ try{ m.remove(); }catch(e){ /* map already torn down, nothing to clean up */ } });
    playerMarker = null; spawnMarkers = {}; poiMarkers = [];
    Object.values(radarMeterAnim).forEach(anim=>{ if(anim.timer) clearTimeout(anim.timer); });
    radarArrowEls = {};
    radarMeterAnim = {};
    lastPOIFetchCenter = null;
    inRangeSpawnUid = null;
    hideHarvestPrompt();
  }catch(e){ console.error('Flora map cleanup error:', e); }
}
function updatePlayerMarkerOnMap(){
  if(!leafletMapInstance || !playerMarker) return;
  const c = getPlayerCoords();
  playerMarker.setLatLng([c.lat, c.lon]);
}
function addSpawnMarker(spawn){
  if(!leafletMapInstance) return;
  const type = SEED_TYPES[spawn.key];
  const specialClass = spawn.kind === 'special' ? ' spawn-special' : '';
  const icon = L.divIcon({
    className:'',
    html:`<div class="map-spawn-icon"><span class="map-spawn-pulse"></span><span class="map-spawn-mark spawn-${type.tierKey}${specialClass}">!</span></div>`,
    iconSize:[34,34]
  });
  const m = L.marker([spawn.lat, spawn.lon], {icon}).addTo(leafletMapInstance);
  m.on('click', ()=> collectWildSpawn(spawn.uid));
  spawnMarkers[spawn.uid] = m;
}
function removeSpawnMarker(uid){
  if(spawnMarkers[uid]){
    try{ spawnMarkers[uid].remove(); }catch(e){ console.error('Flora marker cleanup error:', e); }
  }
  delete spawnMarkers[uid];
}
function syncSpawnMarkers(){
  if(!leafletMapInstance) return;
  const liveUids = new Set(state.mapSpawns.map(s=>s.uid));
  Object.keys(spawnMarkers).forEach(uid=>{ if(!liveUids.has(uid)) removeSpawnMarker(uid); });
  state.mapSpawns.forEach(spawn=>{ if(!spawnMarkers[spawn.uid]) addSpawnMarker(spawn); });
}

/* ===================== RENDER ===================== */
function render(){
  try{
    document.getElementById('coinCount').textContent = fmt(state.coins);
    const lvlEl = document.getElementById('levelChip');
    if(lvlEl) lvlEl.textContent = `Lv ${state.level}`;
    document.querySelectorAll('.nav-btn').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.tab === state.tab);
    });
    const badge = document.getElementById('dexBadge');
    if(badge) badge.style.display = state.dexHasUnseenDiscovery ? 'block' : 'none';

    const content = document.getElementById('content');
    const leavingMap = lastRenderedTab === 'map' && state.tab !== 'map';
    if(leavingMap) destroyLeafletMap();

    const stayingOnMap = state.tab === 'map' && lastRenderedTab === 'map' && leafletMapInstance;
    if(state.tab === 'garden') content.innerHTML = renderGarden();
    else if(state.tab === 'map'){
      if(!stayingOnMap){
        content.innerHTML = renderMap();
        setTimeout(initLeafletMap, 0);
      } else {
        const chip = document.getElementById('mapLocChip');
        if(chip) chip.textContent = mapLocationText();
        syncSpawnMarkers();
        updatePlayerMarkerOnMap();
        updateRadarArrows();
        updateProximityState();
      }
    }
    else if(state.tab === 'dex') content.innerHTML = renderDex();
    else content.innerHTML = renderPouch();

    lastRenderedTab = state.tab;
    renderModal();
  }catch(err){
    console.error('Flora render error:', err);
  }
}

/* ===================== PLANT SVG (staged growth, species color transitions) ===================== */
function stemPathD(stemH, shape){
  if(shape === 'vine') return `M46 66 C 30 ${66-stemH*0.42}, 62 ${66-stemH*0.62}, 45 ${66-stemH}`;
  return `M46 66V${66-stemH}`;
}
function bloomSVG(type, stemH){
  const flY = 66 - stemH;
  if(type.shape === 'vine'){
    const spots = [ [45, flY], [34, flY+16], [56, flY+9] ];
    let clusters = '';
    spots.forEach(([cx,cy])=>{
      let petals = '';
      for(let p=0;p<5;p++){
        const ang = (Math.PI*2/5)*p;
        const px = cx + Math.cos(ang)*5.5, py = cy + Math.sin(ang)*5.5;
        petals += `<ellipse cx="${px}" cy="${py}" rx="4" ry="3" fill="${type.petal}" stroke="${type.center}" stroke-width="0.8" transform="rotate(${ang*180/Math.PI} ${px} ${py})"/>`;
      }
      clusters += `<g>${petals}<circle cx="${cx}" cy="${cy}" r="2.6" fill="${type.center}"/></g>`;
    });
    return `${clusters}<circle cx="34" cy="${flY-10}" r="1.6" fill="#CFF3F1" style="animation: sparkle 1.6s ease-in-out infinite;"/><circle cx="58" cy="${flY-2}" r="1.3" fill="#CFF3F1" style="animation: sparkle 1.6s ease-in-out infinite 0.5s;"/>`;
  }
  if(type.shape === 'radiant'){
    let rays = '';
    for(let r=0;r<10;r++){
      const ang = (Math.PI*2/10)*r;
      const x1 = 46 + Math.cos(ang)*13, y1 = flY + Math.sin(ang)*13;
      const x2 = 46 + Math.cos(ang)*20, y2 = flY + Math.sin(ang)*20;
      rays += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${type.petal}" stroke-width="2" stroke-linecap="round" opacity="0.55"/>`;
    }
    let petals = '';
    const count = type.petals || 8;
    for(let p=0;p<count;p++){
      const ang = (Math.PI*2/count)*p;
      const px = 46 + Math.cos(ang)*11, py = flY + Math.sin(ang)*11;
      petals += `<ellipse cx="${px}" cy="${py}" rx="7.5" ry="5.2" fill="${type.petal}" stroke="${type.center}" stroke-width="1" transform="rotate(${ang*180/Math.PI} ${px} ${py})"/>`;
    }
    return `<circle cx="46" cy="${flY}" r="19" fill="${type.petal}" opacity="0.18" style="animation: pulseRing 2.2s ease-in-out infinite;"/>${rays}${petals}<circle cx="46" cy="${flY}" r="6" fill="${type.center}"/><circle cx="46" cy="${flY}" r="6" fill="none" stroke="#fff" stroke-width="1" opacity="0.6"/>`;
  }
  const count = type.petals || 6;
  let petals = '';
  for(let p=0;p<count;p++){
    const ang = (Math.PI*2/count)*p;
    const px = 46 + Math.cos(ang)*10, py = flY + Math.sin(ang)*10;
    petals += `<ellipse cx="${px}" cy="${py}" rx="6.5" ry="4.5" fill="${type.petal}" stroke="${type.center}" stroke-width="1" transform="rotate(${ang*180/Math.PI} ${px} ${py})"/>`;
  }
  return `<g>${petals}<circle cx="46" cy="${flY}" r="5" fill="${type.center}"/></g><g opacity="0.9"><circle cx="28" cy="${flY-14}" r="2" fill="#F5D68C" style="animation: sparkle 1.6s ease-in-out infinite;"/><circle cx="64" cy="${flY-6}" r="1.6" fill="#F5D68C" style="animation: sparkle 1.6s ease-in-out infinite 0.4s;"/><circle cx="52" cy="${flY-20}" r="1.4" fill="#F5D68C" style="animation: sparkle 1.6s ease-in-out infinite 0.8s;"/></g>`;
}
function plantSVG(potState){
  if(!potState){
    return `<svg width="80" height="26" viewBox="0 0 92 30"><circle cx="46" cy="15" r="13" fill="none" stroke="#B8834F" stroke-width="2.2" stroke-dasharray="4 4"/><path d="M46 9V21M40 15H52" stroke="#B8834F" stroke-width="2.4" stroke-linecap="round"/></svg>`;
  }
  const type = SEED_TYPES[potState.type];
  const frac = Math.min(1, potState.progress / type.threshold);
  const ready = frac >= 1;
  const stemH = 6 + frac*46;
  const leafCount = frac < 0.15 ? 0 : frac < 0.45 ? 2 : frac < 0.75 ? 4 : 4;
  const sway = ready ? 'style="animation: sway 2.6s ease-in-out infinite; transform-origin: 46px 66px;"' : '';
  let leaves = '';
  const leafPositions = [0.35, 0.55, 0.75, 0.9];
  for(let i=0;i<leafCount;i++){
    const t = leafPositions[i];
    const y = 66 - stemH*t;
    const side = i % 2 === 0 ? -1 : 1;
    const lx = 46 + side*3;
    leaves += `<path d="M${lx} ${y} Q${lx + side*16} ${y-6} ${lx + side*4} ${y-16} Q${lx+side*2} ${y-8} ${lx} ${y}Z" fill="${LEAF_GREEN}" stroke="#3F5A38" stroke-width="1" stroke-linejoin="round"/>`;
  }
  let bloom = '';
  if(frac >= 0.75 && frac < 1){
    const budY = 66 - stemH;
    const budT = Math.min(1, (frac-0.75)/0.25);
    const budColor = lerpColor(LEAF_GREEN, type.petal, budT);
    const budR = 3.5 + frac*3;
    bloom = `
      <path d="M${46-budR*0.9} ${budY+budR*0.5} Q46 ${budY+budR*1.7} ${46+budR*0.9} ${budY+budR*0.5}" fill="${LEAF_GREEN}" opacity="0.9"/>
      <ellipse cx="46" cy="${budY}" rx="${budR*0.75}" ry="${budR}" fill="${budColor}" stroke="${type.center}" stroke-width="1"/>`;
  } else if(ready){
    bloom = bloomSVG(type, stemH);
  } else if(frac < 0.15){
    bloom = `<path d="M42 63 Q46 58 50 63" stroke="${LEAF_GREEN}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  }
  return `<svg width="94" height="72" viewBox="0 0 92 70" ${sway}><path d="${stemPathD(stemH, type.shape)}" stroke="#4A6B42" stroke-width="3" fill="none" stroke-linecap="round"/>${leaves}${bloom}</svg>`;
}

function potSVG(index, potState){
  const type = potState ? SEED_TYPES[potState.type] : null;
  return `
  <div class="pot-slot" data-pot="${index}">
    <div class="pot-visual" id="potVisual${index}">${potVisualInner(potState)}</div>
    <div class="pot-label">${potState ? type.name : 'Empty pot — tap to plant'}</div>
  </div>`;
}
function animatePotGrowth(index, fromProgress, toProgress){
  const p = state.pots[index];
  if(!p) return;
  const stepSize = 100;
  let interim = fromProgress;
  function tick(){
    interim = Math.min(toProgress, interim + stepSize);
    const el = document.getElementById('potVisual'+index);
    if(el){ el.innerHTML = potVisualInner({...p, progress: interim}); }
    if(interim < toProgress){ setTimeout(tick, 90); }
  }
  tick();
}

function skyDecoSVG(weather){
  const showSun = weather === 'sunny';
  const cloudOpacity = weather === 'cloudy' ? 0.95 : weather === 'sunny' ? 0.85 : 0.55;
  return `<svg class="sky-deco" viewBox="0 0 400 260" preserveAspectRatio="none" width="100%" height="260">
    ${showSun ? `<circle cx="335" cy="50" r="26" fill="#F7E2A8" opacity="0.9"/>` : ''}
    <g style="animation: floatCloud 6s ease-in-out infinite alternate;"><ellipse cx="72" cy="58" rx="32" ry="14" fill="#ffffff" opacity="${cloudOpacity}"/><ellipse cx="102" cy="50" rx="22" ry="12" fill="#ffffff" opacity="${cloudOpacity}"/></g>
    <g style="animation: floatCloud 8s ease-in-out infinite alternate-reverse;"><ellipse cx="230" cy="74" rx="26" ry="11" fill="#ffffff" opacity="${cloudOpacity*0.8}"/></g>
  </svg>`;
}
function weatherLayerSVG(weather){
  if(weather === 'rainy'){
    let drops = '';
    for(let i=0;i<16;i++){
      const x = (i*26)%400 + (i%3)*6;
      const delay = (i%7)*0.13;
      drops += `<line x1="${x}" y1="0" x2="${x-7}" y2="22" stroke="#8FB4C9" stroke-width="2" stroke-linecap="round" opacity="0.55" style="animation: rainFall 0.85s linear infinite; animation-delay:${delay}s;"/>`;
    }
    return `<svg class="weather-layer" viewBox="0 0 400 300" preserveAspectRatio="none" width="100%" height="300">${drops}</svg>`;
  }
  if(weather === 'snowy'){
    let flakes = '';
    for(let i=0;i<18;i++){
      const x = (i*23)%400 + (i%4)*5;
      const delay = (i%8)*0.4;
      const r = 2 + (i%3);
      flakes += `<circle cx="${x}" cy="0" r="${r}" fill="#fff" opacity="0.85" style="animation: snowFall ${3+(i%3)}s linear infinite; animation-delay:${delay}s;"/>`;
    }
    return `<svg class="weather-layer" viewBox="0 0 400 300" preserveAspectRatio="none" width="100%" height="300">${flakes}</svg>`;
  }
  if(weather === 'cloudy'){
    return `<svg class="weather-layer" viewBox="0 0 400 300" preserveAspectRatio="none" width="100%" height="300">
      <ellipse cx="130" cy="66" rx="55" ry="22" fill="#bdb8a8" opacity="0.4"/>
      <ellipse cx="280" cy="90" rx="62" ry="24" fill="#b3ada0" opacity="0.35"/>
    </svg>`;
  }
  return '';
}

function confettiDots(){
  const colors=['#E3AC3D','#DE8D95','#9C82C4','#4FA0A8','#8CAE7D'];
  let out='';
  for(let i=0;i<14;i++){
    const left = (i*7)%100;
    const color = colors[i%colors.length];
    const delay = (i%6)*0.12;
    out += `<div style="position:absolute; top:-10px; left:${left}%; width:6px; height:6px; background:${color}; border-radius:2px; animation: confettiFall 1.4s ease-in forwards; animation-delay:${delay}s;"></div>`;
  }
  return out;
}

/* ===================== SWIPE-TO-TEAR ===================== */
function setupTearInteraction(){
  if(tearCleanup){ tearCleanup(); tearCleanup = null; }
  const stage = document.getElementById('tearStage');
  const leftHalf = document.getElementById('packLeft');
  const rightHalf = document.getElementById('packRight');
  const hint = document.getElementById('swipeHint');
  if(!stage) return;
  let startX = null, dragging = false, done = false;
  const threshold = 65;
  function onDown(e){
    dragging = true; done = false;
    startX = (e.touches ? e.touches[0].clientX : e.clientX);
    if(hint) hint.style.opacity = '0';
  }
  function onMove(e){
    if(!dragging || done) return;
    const x = (e.touches ? e.touches[0].clientX : e.clientX);
    const dx = x - startX;
    const progress = Math.max(0, Math.min(1, Math.abs(dx)/threshold));
    if(leftHalf) leftHalf.style.transform = `translate(${-dx*0.4}px, ${progress*4}px) rotate(${-progress*16}deg)`;
    if(rightHalf) rightHalf.style.transform = `translate(${dx*0.4}px, ${-progress*4}px) rotate(${progress*16}deg)`;
    if(progress >= 1){ done = true; completeTear(leftHalf, rightHalf); }
  }
  function onUp(){
    dragging = false;
    if(!done){
      if(leftHalf) leftHalf.style.transform = '';
      if(rightHalf) rightHalf.style.transform = '';
      if(hint) hint.style.opacity = '1';
    }
  }
  stage.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  tearCleanup = ()=>{
    stage.removeEventListener('pointerdown', onDown);
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  };
}
function completeTear(leftHalf, rightHalf){
  if(leftHalf) leftHalf.style.transform = 'translate(-70px, 10px) rotate(-28deg)';
  if(rightHalf) rightHalf.style.transform = 'translate(70px, -12px) rotate(26deg)';
  playSfx('pack');
  if(tearCleanup){ tearCleanup(); tearCleanup = null; }
  setTimeout(()=>{
    state.modal = 'burst';
    render();
    setTimeout(()=>{ state.modal = 'reveal'; render(); }, 550);
  }, 220);
}

/* ===================== ACTIONS ===================== */
// Shared walking-progression loop: applies `n` steps to totalSteps and every potted seed's
// growth, checks for a level-up, and re-renders/animates as appropriate. Used by both the
// existing debug "+500 steps" button and the new real accelerometer-driven step counter, so
// real walking drives the exact same seed growth / distance tracking / leveling logic.
function addSteps(n){
  state.totalSteps += n;
  const growthUpdates = [];
  state.pots = state.pots.map((p,i)=>{
    if(!p) return p;
    const type = SEED_TYPES[p.type];
    const newProgress = Math.min(type.threshold, p.progress + n);
    if(newProgress > p.progress) growthUpdates.push({index:i, from:p.progress, to:newProgress, threshold:type.threshold});
    return {...p, progress:newProgress};
  });
  const leveled = checkLevelUp();
  if(state.tab === 'garden' && !state.modal){
    growthUpdates.forEach(u=> animatePotGrowth(u.index, u.from, u.to));
  } else {
    render();
  }
  return { growthUpdates, leveled };
}
function simulateSteps(){
  const { growthUpdates, leveled } = addSteps(500);
  if(!leveled){
    const anyReady = growthUpdates.some(u=> u.to >= u.threshold && u.from < u.threshold);
    if(anyReady) toast('🌼 A plant is ready to harvest!');
    else if(growthUpdates.length) toast('+500 steps — your garden is growing!');
    else toast('+500 steps logged');
  }
}

function openPlantModal(index, uid){
  state.plantTarget = index;
  state.plantSelectedUid = uid || (state.pouch[0] ? String(state.pouch[0].uid) : 'free-common');
  state.modal = 'plantConfirm';
  render();
}
function openPotInspect(index){
  state.inspectPotIndex = index;
  state.modal = 'potInspect';
  render();
}

function plantSeed(uid){
  if(uid === 'free-common'){
    state.pots[state.plantTarget] = {uid:'free-common', type:'common', progress:0};
    state.modal = null;
    playSfx('plant');
    toast(`Planted ${SEED_TYPES.common.name}!`);
    render();
    return;
  }
  const idx = state.pouch.findIndex(s=> String(s.uid) === String(uid));
  if(idx === -1) return;
  const item = state.pouch[idx];
  state.pots[state.plantTarget] = {uid: item.uid, type: item.type, progress:0};
  state.pouch.splice(idx,1);
  state.modal = null;
  playSfx('plant');
  toast(`Planted ${SEED_TYPES[item.type].name}!`);
  render();
}

function harvestPot(index){
  const p = state.pots[index];
  if(!p) return;
  const type = SEED_TYPES[p.type];
  if(p.progress < type.threshold) return;
  state.coins += type.harvest;
  state.totalCoinsEarned += type.harvest;
  state.totalHarvested += 1;
  state.dex[p.type] = (state.dex[p.type] || 0) + 1;
  state.pots[index] = null;
  playSfx('harvest');
  toast(`Harvested! +${type.harvest}¢`);
}

function requestCompost(uid){
  state.compostTargetUid = uid;
  state.modal = 'compostConfirm';
  render();
}
function confirmCompostAnimated(){
  const uid = state.compostTargetUid;
  state.modal = null;
  render();
  requestAnimationFrame(()=> animateCompostFly(uid));
}
function animateCompostFly(uid){
  const item = state.pouch.find(s=> String(s.uid) === String(uid));
  if(!item) return;
  const type = SEED_TYPES[item.type];
  const sourceEl = document.querySelector(`.seed-card[data-seed-uid="${uid}"] .seed-icon-wrap`);
  const target = document.getElementById('composterCorner');
  const phoneEl = document.getElementById('phone');
  if(sourceEl && target && phoneEl){
    const startRect = sourceEl.getBoundingClientRect();
    const endRect = target.getBoundingClientRect();
    const phoneRect = phoneEl.getBoundingClientRect();
    const flyEl = sourceEl.cloneNode(true);
    flyEl.style.position='absolute';
    flyEl.style.left=(startRect.left-phoneRect.left)+'px';
    flyEl.style.top=(startRect.top-phoneRect.top)+'px';
    flyEl.style.width=startRect.width+'px';
    flyEl.style.height=startRect.height+'px';
    flyEl.style.margin='0'; flyEl.style.zIndex='80';
    flyEl.style.transition='transform 0.55s cubic-bezier(.4,0,.2,1), opacity 0.55s ease';
    flyEl.style.pointerEvents='none';
    phoneEl.appendChild(flyEl);
    requestAnimationFrame(()=>{
      const dx=(endRect.left+endRect.width/2)-(startRect.left+startRect.width/2);
      const dy=(endRect.top+endRect.height/2)-(startRect.top+startRect.height/2);
      flyEl.style.transform=`translate(${dx}px, ${dy}px) scale(0.2)`;
      flyEl.style.opacity='0.15';
    });
    setTimeout(()=>{ flyEl.remove(); finalizeCompost(uid, type); }, 580);
  } else {
    finalizeCompost(uid, type);
  }
}
function finalizeCompost(uid, type){
  const idx = state.pouch.findIndex(s=> String(s.uid) === String(uid));
  if(idx !== -1) state.pouch.splice(idx,1);
  state.coins += type.compost;
  state.totalCoinsEarned += type.compost;
  playSfx('coin');
  toast(`Composted for +${type.compost}¢`);
  render();
  const bumpEl = document.getElementById('composterCorner');
  if(bumpEl){ bumpEl.classList.add('bump'); setTimeout(()=> bumpEl.classList.remove('bump'), 500); }
}

function buyPacket(packId){
  const pack = SHOP_PACKS.find(p=> p.id === packId);
  if(!pack || state.coins < pack.cost) return;
  state.coins -= pack.cost;
  state.isLevelPackFlow = false;
  state.activePackId = packId;
  state.revealSeed = rollPack(pack);
  state.modal = 'tearing';
  render();
}

function collectRevealedSeed(){
  const iconEl = document.getElementById('revealSeedIcon');
  const pouchNav = document.querySelector('.nav-btn[data-tab="pouch"]');
  const phoneEl = document.getElementById('phone');
  const seedKey = state.revealSeed;

  function finish(){
    state.pouch.push({uid: seedUid++, type: seedKey});
    const isNew = checkDiscovery(seedKey);
    if(isNew){
      state.modal = 'newSpecies';
      state.celebrateSpecies = seedKey;
      render();
      return;
    }
    if(state.isLevelPackFlow && state.pendingLevelPacks.length > 0){
      openNextLevelPack();
      return;
    }
    state.isLevelPackFlow = false;
    toast('Seed added to your pouch! 🌱');
    render();
  }

  if(iconEl && pouchNav && phoneEl){
    const startRect = iconEl.getBoundingClientRect();
    const endRect = pouchNav.getBoundingClientRect();
    const phoneRect = phoneEl.getBoundingClientRect();
    const flyEl = iconEl.cloneNode(true);
    flyEl.removeAttribute('id');
    flyEl.style.position = 'absolute';
    flyEl.style.left = (startRect.left - phoneRect.left) + 'px';
    flyEl.style.top = (startRect.top - phoneRect.top) + 'px';
    flyEl.style.width = startRect.width + 'px';
    flyEl.style.height = startRect.height + 'px';
    flyEl.style.margin = '0';
    flyEl.style.zIndex = '80';
    flyEl.style.transition = 'transform 0.6s cubic-bezier(.4,0,.2,1), opacity 0.6s ease';
    flyEl.style.pointerEvents = 'none';
    phoneEl.appendChild(flyEl);

    state.modal = null;
    render();

    requestAnimationFrame(()=>{
      const dx = (endRect.left + endRect.width/2) - (startRect.left + startRect.width/2);
      const dy = (endRect.top + endRect.height/2) - (startRect.top + startRect.height/2);
      flyEl.style.transform = `translate(${dx}px, ${dy}px) scale(0.15)`;
      flyEl.style.opacity = '0.2';
    });
    setTimeout(()=>{
      flyEl.remove();
      pulseNav('pouch');
      finish();
    }, 620);
  } else {
    finish();
  }
}

/* ===================== EVENT DELEGATION ===================== */
function handleClick(e){
  try{
    const el = e.target;
    const actionEl = el.closest('[data-action]');
    if(actionEl){
      const action = actionEl.dataset.action;
      if(action === 'simulate'){ simulateSteps(); return; }
      if(action === 'open-shop'){ state.modal = 'shop'; render(); return; }
      if(action === 'buy-pack'){ buyPacket(actionEl.dataset.pack); return; }
      if(action === 'collect-seed'){ collectRevealedSeed(); return; }
      if(action === 'close-modal'){ state.modal = null; render(); return; }
      if(action === 'close-chain'){ closeChainedModal(); return; }
      if(action === 'open-profile'){ state.modal = 'profile'; render(); return; }
      if(action === 'open-settings'){ state.modal = 'settings'; render(); return; }
      if(action === 'toggle-music'){ toggleMusic(); return; }
      if(action === 'toggle-sfx'){ toggleSfx(); return; }
      if(action === 'claim-streak'){ claimDailyReward(); return; }
      if(action === 'harvest-pot'){ harvestPot(parseInt(actionEl.dataset.idx)); state.modal = null; render(); return; }
      if(action === 'plant-request'){
        const emptyIdx = state.pots.findIndex(p=>!p);
        if(emptyIdx === -1){ toast('All pots are full!'); return; }
        openPlantModal(emptyIdx, actionEl.dataset.uid);
        return;
      }
      if(action === 'confirm-plant'){ plantSeed(state.plantSelectedUid); return; }
      if(action === 'compost'){ requestCompost(actionEl.dataset.uid); return; }
      if(action === 'confirm-compost'){ confirmCompostAnimated(); return; }
      if(action === 'enable-location'){ requestLocation(); return; }
      if(action === 'enable-compass'){ requestCompass(); return; }
      if(action === 'toggle-walk'){ toggleWalkSession(); return; }
      if(action === 'enable-notifications'){ requestNotifications(); return; }
      if(action === 'collect-nearest'){ if(inRangeSpawnUid) collectWildSpawn(inRangeSpawnUid); return; }
    }

    const backdrop = el.closest('.modal-backdrop');
    if(backdrop && el === backdrop && backdrop.id === 'backdrop'){ state.modal = null; render(); return; }

    const potSlot = el.closest('.pot-slot');
    if(potSlot){
      const idx = parseInt(potSlot.dataset.pot);
      const p = state.pots[idx];
      if(!p) openPlantModal(idx);
      else openPotInspect(idx);
      return;
    }

    const navBtn = el.closest('.nav-btn');
    if(navBtn){
      if(navBtn.dataset.tab === 'dex') state.dexHasUnseenDiscovery = false;
      state.tab = navBtn.dataset.tab;
      render();
      return;
    }
  }catch(err){
    console.error('Flora click handler error:', err);
    toast('Oops, that hiccuped — try again');
  }
}
document.getElementById('phone').addEventListener('click', handleClick);

render();
initStreak();
loadMapPersistence();
setInterval(cycleWeather, 14000);
mapWorldTimer = setInterval(mapWorldTick, MAP_TICK_MS);

// sleeping, the tab being backgrounded, or the clock otherwise drifting while we were away.
window.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible'){ mapWorldTick(); ensureLocationTrackingActive(); if(state.walkActive && !wakeLockSentinel) requestWakeLock(); } });
window.addEventListener('focus', ()=>{ mapWorldTick(); ensureLocationTrackingActive(); });
window.addEventListener('resize', ()=>{ if(leafletMapInstance) updateRadarArrows(); });
