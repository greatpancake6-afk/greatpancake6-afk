/* ===================== DAILY STREAK (persistent) ===================== */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function isYesterday(dateStr){
  if(!dateStr) return false;
  const diff = Math.round((new Date(todayStr()) - new Date(dateStr))/86400000);
  return diff === 1;
}
function streakClaimable(){ return !state.streak || state.streak.lastClaim !== todayStr(); }
function nextStreakDay(){
  if(!state.streak || !state.streak.lastClaim) return 1;
  if(state.streak.lastClaim === todayStr()) return state.streak.count;
  if(isYesterday(state.streak.lastClaim)) return state.streak.count + 1;
  return 1;
}
function rewardForDay(day){
  const cycle = ((day-1) % 7) + 1;
  const coins = 10 + cycle*8;
  let seedKey = null;
  if(cycle===3 || cycle===5) seedKey = pickSeedFromTier('uncommon');
  if(cycle===7) seedKey = pickSeedFromTier('rare');
  return {coins, seedKey, cycle};
}
async function initStreak(){
  let data = null;
  try{
    const res = await window.storage.get('flora_daily_streak', false);
    if(res && res.value) data = JSON.parse(res.value);
  }catch(e){ data = null; }
  state.streak = data || { count:0, lastClaim:null };
  render();
}
async function claimDailyReward(){
  const day = nextStreakDay();
  if(state.streak && state.streak.lastClaim === todayStr()) return;
  const reward = rewardForDay(day);
  state.coins += reward.coins;
  state.totalCoinsEarned += reward.coins;
  let isNew = false;
  if(reward.seedKey){
    state.pouch.push({uid: seedUid++, type: reward.seedKey});
    isNew = checkDiscovery(reward.seedKey);
  }
  state.streak = { count: day, lastClaim: todayStr() };
  try{ await window.storage.set('flora_daily_streak', JSON.stringify(state.streak), false); }catch(e){ console.error('Flora storage error:', e); }
  state.lastReward = reward;
  state.pendingCelebration = isNew ? reward.seedKey : null;
  state.modal = 'streakReward';
  playSfx('coin');
  render();
}
function closeChainedModal(){
  if(state.pendingCelebration){

/* ===================== MAP: geolocation, notifications, spawns, Leaflet lifecycle ===================== */
let leafletMapInstance = null;
let playerMarker = null;
let playerMarkerAnimFrame = null; // requestAnimationFrame handle for the marker's smooth glide between fixes
let playerMarkerAnimFrom = null;
let playerMarkerAnimTo = null;
let playerMarkerAnimStart = 0;
const PLAYER_MARKER_ANIM_MS = 900; // glide toward each new fix over this long instead of snapping to it
let spawnMarkers = {};       // uid -> Leaflet marker
let poiMarkers = [];
let safetyZones = []; // schools/hospitals/residential exclusion buffer, fetched per map session
let lastPOIFetchCenter = null; // where POIs/safety-zones were last fetched from
let poiRefreshInFlight = false;
let watchId = null;
let mapGeneration = 0;       // bumped on every init/destroy so stale async work (OSM fetch) is ignored
let lastGeoUpdateTs = 0;
const GEO_UPDATE_MIN_INTERVAL_MS = 3000; // throttle heavier map work (recenter/marker move) to preserve battery
// Robust filtering at the geolocation watch itself, upstream of everything else: a raw fix
// reporting worse accuracy than GEO_MAX_ACCURACY_M is treated as unreliable noise and skipped
// outright — it never even reaches state.mapLocation — unless we haven't accepted a usable fix in
// a while, in which case it's let through anyway so tracking doesn't stall indefinitely (e.g.
// indoors/urban-canyon conditions where only poor fixes are ever available).
let lastAcceptedFixTs = 0;
const GEO_MAX_ACCURACY_M = 35;
const GEO_STALE_FIX_MS = 12000;
let mapWorldTimer = null;    // world-tick interval handle (expiration / respawn / special spawns)
let mapStateLoaded = false;  // guards against ticking before persisted state has loaded
let inRangeSpawnUid = null;  // uid of the spawn currently within COLLECT_RADIUS_M, if any

let compassEnabled = false;
let compassHandler = null;
let deviceHeading = 0;         // last raw, normalized (0-360) heading — used anywhere a plain compass reading is needed
let smoothedHeadingDeg = null; // unwrapped/continuous — can exceed 0-360 or go negative, on purpose (see below)
const HEADING_SMOOTHING_ALPHA = 0.25; // low-pass filter strength: lower = smoother/slower, higher = snappier

// Shortest signed angular delta from `from` to `to`, both in degrees — result is always in
// (-180, 180]. This is the key to seamless rotation: CSS transform:rotate() interpolates the raw
// numbers it's given, so naively feeding it a normalized 0-360 heading makes the arrow visually
// whip almost all the way around every time the compass crosses the 0°/360° boundary (e.g. 358°
// to 3° previously animated through 357,356,...4,3 — a 355° spin — instead of a smooth 5° turn).
function shortestAngleDelta(from, to){
  return (((to - from + 180) % 360) + 360) % 360 - 180;
}

function mapLocationText(){
  const loc = state.mapLocation;
  if(loc.status==='granted') return `📍 ${loc.lat.toFixed(4)}, ${loc.lon.toFixed(4)}`;
  if(loc.status==='denied') return '📍 Location unavailable — showing demo area';
  if(loc.status==='locating') return '📍 Locating...';
  return '📍 Location not enabled yet';
}
// Starts a single, global navigator.geolocation.watchPosition that keeps state.mapLocation (and
// watchId) updated for the entire app session — independent of which tab is active. This is
// intentionally NOT re-created or torn down when the map tab mounts/unmounts; see destroyLeafletMap.
function requestLocation(){
  if(!navigator.geolocation){ state.mapLocation = {status:'denied', lat:null, lon:null}; render(); return; }
  state.mapLocation = {status:'locating', lat:null, lon:null};
  render();
  try{
    if(watchId !== null) navigator.geolocation.clearWatch(watchId); // never stack multiple watches
    watchId = navigator.geolocation.watchPosition(
      pos=>{
        const accuracy = typeof pos.coords.accuracy === 'number' ? pos.coords.accuracy : null;
        const nowTs = Date.now();
        if(accuracy !== null && accuracy > GEO_MAX_ACCURACY_M && (nowTs - lastAcceptedFixTs) < GEO_STALE_FIX_MS){
          return; // low-quality fix and we still have a recent good one — ignore it entirely rather than let it jerk the player position around
        }
        lastAcceptedFixTs = nowTs;
        const hadRealFixBefore = state.mapLocation.status === 'granted';
        state.mapLocation = {status:'granted', lat:pos.coords.latitude, lon:pos.coords.longitude};
        // If the map tab is showing the blank permission screen (no Leaflet instance mounted
        // yet) and this is the fix that satisfies the last missing permission, a full render()
        // is needed to swap from that screen to the real map and mount Leaflet — the lightweight
        // per-fix DOM patches below only touch elements that exist once the real map is showing.
        if(!hadRealFixBefore && state.tab === 'map' && !leafletMapInstance && mapPermissionsReady()){
          render();
          return;
        }
        // Cheap UI updates happen every time...
        const chip = document.getElementById('mapLocChip');
        if(chip) chip.textContent = mapLocationText();
        // The very first real GPS lock bypasses the throttle below entirely: any ambient seeds
        // spawned earlier (before we had a real position, using the DEMO_CENTER fallback) get
        // reconciled onto the player's real coordinates immediately, instead of waiting up to
        // GEO_UPDATE_MIN_INTERVAL_MS or the next 20s world-tick to notice.
        if(!hadRealFixBefore && mapStateLoaded) mapWorldTick();
        // Distance meter and the player marker's glide target update on EVERY accepted fix,
        // unthrottled — these are cheap, purely-local DOM/state updates, so gating them behind the
        // battery throttle below was exactly what caused the meter's "dead zone" (having to walk
        // several meters before anything visibly moved) and the marker's start-stop stutter
        // (a fresh multi-meter jump only every few seconds, instead of a steady glide).
        if(leafletMapInstance){
          updatePlayerMarkerOnMap();
          updateRadarArrows();
          updateProximityState();
        }
        // Recentering the map viewport and re-querying Overpass for nearby POIs are comparatively
        // expensive (map pan/zoom repaint, network requests), so those alone stay throttled to
        // save battery.
        const now = Date.now();
        if(now - lastGeoUpdateTs < GEO_UPDATE_MIN_INTERVAL_MS) return;
        lastGeoUpdateTs = now;
        if(leafletMapInstance){
          leafletMapInstance.setView([pos.coords.latitude, pos.coords.longitude], leafletMapInstance.getZoom(), {animate:true});
          maybeRefreshPOIs({lat: pos.coords.latitude, lon: pos.coords.longitude});
        }
      },
      err=>{ console.error('Flora geolocation error:', err); state.mapLocation = {status:'denied', lat:null, lon:null}; render(); },
      { enableHighAccuracy:true, timeout:10000, maximumAge:5000 }
    );
  }catch(e){ console.error('Flora geolocation setup error:', e); state.mapLocation = {status:'denied', lat:null, lon:null}; render(); }
}
// Defensive safeguard: if tracking was previously granted but the underlying watch was somehow
// lost (e.g. the OS silently dropped it while the device was asleep), restart it. Called from the
// existing visibility/focus handlers below — never removes or replaces any other behavior there.
function ensureLocationTrackingActive(){
  if(state.mapLocation.status === 'granted' && watchId === null) requestLocation();
}
function requestNotifications(){
  try{
    if(typeof Notification === 'undefined') return;
    Notification.requestPermission().then(perm=>{ state.notifPermission = perm; render(); });
  }catch(e){ console.error('Flora notification permission error:', e); }
}
function sendLocalNotification(title, body){
  try{
    if(typeof Notification === 'undefined') return;
    if(Notification.permission === 'granted') new Notification(title, {body});
  }catch(e){ console.error('Flora notification error:', e); }
}

/* ---- Compass / directional heading ---- */
function updatePlayerHeading(rawHeading){
  const normalized = ((rawHeading % 360) + 360) % 360;
  deviceHeading = normalized;
  if(smoothedHeadingDeg === null){
    smoothedHeadingDeg = normalized; // first reading — nothing to interpolate from yet
  } else {
    // Take the shortest path from where we currently are (mod 360) to the new raw reading, then
    // only blend in a fraction of that step (low-pass filter) to damp raw sensor jitter — and
    // keep accumulating on the UNWRAPPED value so the applied rotation never has to jump back
    // across the 0°/360° seam.
    const delta = shortestAngleDelta(((smoothedHeadingDeg % 360) + 360) % 360, normalized);
    smoothedHeadingDeg += delta * HEADING_SMOOTHING_ALPHA;
  }
  if(!playerMarker) return;
  const el = playerMarker.getElement ? playerMarker.getElement() : null;
  if(!el) return;
  const arrow = el.querySelector('.map-player-arrow');
  // The element's own CSS transition (transform 0.25s ease-out) handles the final frame-to-frame
  // smoothing on top of this — now that the value it's given is continuous, that transition can
  // no longer be tricked into spinning the long way around.
  if(arrow) arrow.style.transform = `rotate(${smoothedHeadingDeg}deg)`;
}
function handleOrientationEvent(e){
  let heading = null;
  if(typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)){
    heading = e.webkitCompassHeading; // iOS Safari: already degrees clockwise from true north
  } else if(e.alpha !== null && e.alpha !== undefined){
    heading = 360 - e.alpha; // approximate compass heading from device orientation
  }
  if(heading !== null && !isNaN(heading)) updatePlayerHeading(heading);
}
function attachCompassListener(){
  if(compassHandler) return;
  compassHandler = handleOrientationEvent;
  if('ondeviceorientationabsolute' in window){
    window.addEventListener('deviceorientationabsolute', compassHandler, true);
  } else if(typeof DeviceOrientationEvent !== 'undefined'){
    window.addEventListener('deviceorientation', compassHandler, true);
  }
}
function detachCompassListener(){
  if(!compassHandler) return;
  window.removeEventListener('deviceorientationabsolute', compassHandler, true);
  window.removeEventListener('deviceorientation', compassHandler, true);
  compassHandler = null;
}
function requestCompass(){
  try{
    if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      // iOS 13+ requires an explicit user-gesture permission prompt.
      DeviceOrientationEvent.requestPermission().then(perm=>{
        if(perm === 'granted'){ compassEnabled = true; attachCompassListener(); render(); }
        else toast('Compass permission was not granted.');
      }).catch(e=>{ console.error('Flora compass permission error:', e); toast('Could not enable compass on this device.'); });
    } else if(typeof DeviceOrientationEvent !== 'undefined'){
      compassEnabled = true;
      attachCompassListener();
      render();
    } else {
      toast('Compass not supported on this device.');
    }
  }catch(e){ console.error('Flora compass setup error:', e); }
}

/* ---- Persistence: ambient/special spawn state survives reloads (window.storage, best-effort) ---- */
// BUG FIX (map "regenerates a new random layout every time it's reopened"): the actual spawn
// layout was always being computed from persisted state correctly, but the write to storage was
// debounced by MAP_SAVE_DEBOUNCE_MS (500ms) and nothing ever forced that pending write to flush
// before the page could be closed/reloaded/backgrounded. A quick reload -- e.g. right after the
// very first bootstrap batch of ambient seeds spawns in -- could land inside that 500ms window,
// discard the unsaved write, and reload back onto an empty board that then re-rolled a brand new
// layout, which is exactly what read as "random every time". mapStateSnapshot()/flushMapStateNow()
// below let every unload-adjacent event force an immediate, un-debounced write so the very latest
// layout is always the one actually sitting in storage.
let mapSaveTimer = null;
function mapStateSnapshot(){
  return JSON.stringify({
    spawns: state.mapSpawns,
    respawnQueue: state.mapRespawnQueue,
    nextSpecialSpawnAt: state.nextSpecialSpawnAt,
    ambientTargetCount: state.ambientTargetCount
  });
}
function saveMapStateDebounced(){
  if(mapSaveTimer) clearTimeout(mapSaveTimer);
  mapSaveTimer = setTimeout(async ()=>{
    mapSaveTimer = null;
    try{
      if(!window.storage) return;
      await window.storage.set('flora_map_state', mapStateSnapshot(), false);
    }catch(e){ console.error('Flora map state save error:', e); }
  }, MAP_SAVE_DEBOUNCE_MS);
}
// Bypasses the debounce entirely -- called from pagehide/visibilitychange-hidden/beforeunload so
// the freshest layout is committed to storage immediately instead of racing an in-flight timer.
function flushMapStateNow(){
  if(!mapStateLoaded) return;
  if(mapSaveTimer){ clearTimeout(mapSaveTimer); mapSaveTimer = null; }
  try{
    if(!window.storage) return;
    // Fire-and-forget: unload-time handlers can't reliably await a promise, but window.storage's
    // set() (real artifact API or the localStorage-backed fallback) both resolve synchronously
    // enough in practice for this best-effort save to land.
    window.storage.set('flora_map_state', mapStateSnapshot(), false);
  }catch(e){ console.error('Flora map state flush error:', e); }
}
// Structural validity check for one spawn record: every field a spawn is ever read by must be
// exactly the right type/shape, or it's rejected outright. This exists specifically so a record
// hydrated from storage (a different session, a different location, a different — possibly much
// older — build of the game, or manually-edited/corrupted localStorage) can never be trusted just
// because it *looks* like an object with the right keys.
function isValidSpawnRecord(s){
  if(!s || typeof s !== 'object') return false;
  if(typeof s.uid !== 'string' || !s.uid) return false;
  if(typeof s.key !== 'string' || !SEED_TYPES[s.key]) return false;
  if(s.kind !== 'ambient' && s.kind !== 'special') return false;
  if(!Number.isFinite(s.lat) || s.lat < -90 || s.lat > 90) return false;
  if(!Number.isFinite(s.lon) || s.lon < -180 || s.lon > 180) return false;
  if(!Number.isFinite(s.spawnedAt) || !Number.isFinite(s.expiresAt)) return false;
  return true;
}
// Runs immediately on hydration, before anything else ever touches state.mapSpawns. Deliberately
// uses Number.isFinite() rather than a bare numeric comparison: `NaN > 500` evaluates to `false`
// in JavaScript, so a corrupted lat/lon (undefined, a string, NaN from a bad JSON.parse, a field
// dropped by a future/past schema change) would otherwise silently pass every ordinary "is this
// too far?" check instead of being caught — this closes that gap at the door, before distance is
// ever computed against it.
function sanitizeSpawnShapes(spawns){
  if(!Array.isArray(spawns)) return [];
  return spawns.filter(isValidSpawnRecord);
}
// Distance-based sweep, run every world tick: drops any spawn — ambient OR special, freshly
// generated or hydrated from a previous session — that is farther from the player's CURRENT real
// position than its own kind's radius allows, AND independently re-checks it against the
// absolute, kind-agnostic ceiling on top. Two spawn-generation-time safeguards already exist
// (pickGuardedSafeSpawnPoint's reroll loop, and MIN_COS_LAT preventing the coordinate math itself
// from ever exploding) — this is what catches everything upstream of generation instead: a
// player who traveled to a new city between sessions, or a record hydrated from a much older
// build that predates today's spawn-radius rules entirely. Only runs once we trust the player's
// position (a real 'granted' GPS fix), so it never fights the DEMO_CENTER fallback before a lock
// is acquired.
function sweepOutOfBoundsSpawns(){
  if(state.mapLocation.status !== 'granted') return;
  const player = getPlayerCoords();
  const outOfBounds = state.mapSpawns.filter(s=>{
    const d = haversineMeters(player.lat, player.lon, s.lat, s.lon);
    if(!Number.isFinite(d)) return true; // a corrupted coordinate that somehow still reached this point — drop it
    const kindLimit = s.kind === 'special' ? SPECIAL_RADIUS_M : AMBIENT_RADIUS_M;
    return d > kindLimit || d > ABSOLUTE_MAX_SPAWN_DISTANCE_M;
  });
  if(!outOfBounds.length) return;
  outOfBounds.forEach(s=> removeSpawnMarker(s.uid));
  const badUids = new Set(outOfBounds.map(s=>s.uid));
  state.mapSpawns = state.mapSpawns.filter(s=> !badUids.has(s.uid));
}
/* ---- Progress persistence: level, coins, room-key/unlock state survive reloads ---- */
async function saveProgressState(){
  try{
    if(!window.storage) return;
    await window.storage.set('flora_progress_state', JSON.stringify({
      level: state.level,
      coins: state.coins,
      totalCoinsEarned: state.totalCoinsEarned,
      roomUnlocked: state.roomUnlocked,
      roomKeys: state.roomKeys
    }), false);
  }catch(e){ console.error('Flora progress save error:', e); }
}
async function loadProgressState(){
  try{
    if(!window.storage) return;
    const res = await window.storage.get('flora_progress_state', false);
    if(res && res.value){
      const data = JSON.parse(res.value);
      if(Number.isFinite(data.level) && data.level >= 1) state.level = data.level;
      if(Number.isFinite(data.coins) && data.coins >= 0) state.coins = data.coins;
      if(Number.isFinite(data.totalCoinsEarned) && data.totalCoinsEarned >= 0) state.totalCoinsEarned = data.totalCoinsEarned;
      if(data.roomUnlocked && typeof data.roomUnlocked === 'object') state.roomUnlocked = { windowsill:true, ...data.roomUnlocked };
      if(data.roomKeys && typeof data.roomKeys === 'object') state.roomKeys = { ...data.roomKeys };
    }
  }catch(e){ console.error('Flora progress load error:', e); }
  render();
}

// Interactive key-unlock experience: idle -> turning -> breaking -> falling -> unlocked. Each
// phase is its own bounded, one-shot CSS animation (see .key-anim-* below) triggered simply by
// that phase's markup freshly mounting on the next render() -- so a mid-sequence render doesn't
// desync or restart anything, it just shows whichever phase is current. The room only actually
// becomes usable (isRoomUnlocked) once the full sequence finishes.
function startKeyUnlock(roomId){
  if(state.keyUnlockAnim) return; // one unlock animation at a time
  if(!state.roomKeys[roomId]) return;
  state.keyUnlockAnim = { roomId, phase:'turning' };
  render();
  setTimeout(()=>{
    if(!state.keyUnlockAnim || state.keyUnlockAnim.roomId !== roomId) return;
    state.keyUnlockAnim.phase = 'breaking';
    render();
    setTimeout(()=>{
      if(!state.keyUnlockAnim || state.keyUnlockAnim.roomId !== roomId) return;
      state.keyUnlockAnim.phase = 'falling';
      render();
      setTimeout(()=>{
        if(!state.keyUnlockAnim || state.keyUnlockAnim.roomId !== roomId) return;
        state.roomUnlocked[roomId] = true;
        delete state.roomKeys[roomId];
        state.keyUnlockAnim = null;
        saveProgressState();
        const room = ROOMS.find(r=>r.id===roomId);
        toast(`🔓 ${room.name} unlocked!`);
        playSfx('harvest');
        render();
      }, 550);
    }, 450);
  }, 700);
}

async function loadMapPersistence(){
  try{
    if(window.storage){
      const res = await window.storage.get('flora_map_state', false);
      if(res && res.value){
        const data = JSON.parse(res.value);
        state.mapSpawns = sanitizeSpawnShapes(data.spawns);
        state.mapRespawnQueue = Array.isArray(data.respawnQueue) ? data.respawnQueue : [];
        state.nextSpecialSpawnAt = typeof data.nextSpecialSpawnAt === 'number' ? data.nextSpecialSpawnAt : null;
        state.ambientTargetCount = data.ambientTargetCount || null;
      }
    }
  }catch(e){ console.error('Flora map state load error:', e); }
  if(!state.ambientTargetCount){
    state.ambientTargetCount = AMBIENT_TARGET_MIN + Math.floor(Math.random()*(AMBIENT_TARGET_MAX-AMBIENT_TARGET_MIN+1));
  }
  if(!state.nextSpecialSpawnAt){
    state.nextSpecialSpawnAt = Date.now() + randBetween(SPECIAL_INTERVAL_MIN_MS, SPECIAL_INTERVAL_MAX_MS);
  }
  mapStateLoaded = true;
  mapWorldTick(); // reconcile immediately: prune anything that expired, and sweep anything out-of-bounds, while the app was closed
}

/* ---- Wild seed spawning: organic placement (never snapped to POIs), category-aware, timed & expiring ---- */
function addSpawnToState(key, lat, lon, kind){
  const now = Date.now();
  const spawn = { uid: 'spawn_'+(seedUid++), key, lat, lon, kind, spawnedAt: now, expiresAt: now + SEED_LIFESPAN_MS };
  state.mapSpawns.push(spawn);
  if(state.tab === 'map' && leafletMapInstance){ addSpawnMarker(spawn); updateRadarArrows(); }
  saveMapStateDebounced();
  return spawn;
}
// Ambient seeds pull ONLY from the "Both" (shop+map) category pool, weighted so commons are common
// — unless forcedTierKey is given (used for the guaranteed initial/bootstrap batch, which must be
// specifically common+both seeds per spec).
function spawnAmbientSeed(forcedTierKey){
  const player = getPlayerCoords();
  const tierKey = forcedTierKey || pickTier(AMBIENT_TIER_WEIGHTS);
  let key = pickSpeciesForCategoryTier('both', tierKey);
  if(!key) key = DEX_ORDER.find(k=> SEED_TYPES[k].category==='both'); // defensive fallback, should never trigger
  if(!key) return;
  const pt = pickGuardedSafeSpawnPoint(player, 15, AMBIENT_RADIUS_M);
  addSpawnToState(key, pt.lat, pt.lon, 'ambient');
}
// Special timed seeds pull ONLY from the "Map Only" category pool — rarer tiers spawn less often.
// Special spawns reach further out (up to 1500m) to encourage a longer walk.
function spawnSpecialSeed(){
  const player = getPlayerCoords();
  const tierKey = pickTier(SPECIAL_TIER_WEIGHTS);
  let key = pickSpeciesForCategoryTier('map', tierKey);
  if(!key) key = DEX_ORDER.find(k=> SEED_TYPES[k].category==='map');
  if(!key) return;
  const pt = pickGuardedSafeSpawnPoint(player, 40, SPECIAL_RADIUS_M);
  addSpawnToState(key, pt.lat, pt.lon, 'special');
  const type = SEED_TYPES[key];
  const label = type.rarityLabel.charAt(0) + type.rarityLabel.slice(1).toLowerCase();
  toast(`✨ A ${label} ${type.name} has sprouted nearby!`);
  sendLocalNotification('Flora', `A ${label} ${type.name} has sprouted nearby!`);
}
function pickSpeciesForCategoryTier(category, tierKey){
  const candidates = DEX_ORDER.filter(k=> SEED_TYPES[k].tierKey===tierKey && SEED_TYPES[k].category===category);
  if(!candidates.length) return null;
  return candidates[Math.floor(Math.random()*candidates.length)];
}
// Every spawn coordinate — ambient or special, POI-anchored or fully organic — is verified here
// against the real haversine distance from the player before it's ever allowed to become a live
// spawn. A candidate beyond the limit is instantly dismissed and re-rolled from scratch, in a loop,
// until a valid point is found; SPAWN_REROLL_HARD_CAP only exists so a pathological edge case can
// never hang the tab — pickSafeSpawnPoint()'s own math (offsetLatLon's MIN_COS_LAT floor +
// clampedPointNear's own verification) already keeps the overwhelming majority of candidates valid
// on the very first try, so that cap is never expected to be hit in practice.
const SPAWN_REROLL_HARD_CAP = 200;
function clampPointToRadius(center, pt, maxM){
  const d = haversineMeters(center.lat, center.lon, pt.lat, pt.lon);
  if(d <= maxM) return pt;
  const scale = maxM / d;
  return { lat: center.lat + (pt.lat-center.lat)*scale, lon: center.lon + (pt.lon-center.lon)*scale };
}
function pickGuardedSafeSpawnPoint(center, minM, maxM){
  const cappedMax = Math.min(maxM, ABSOLUTE_MAX_SPAWN_DISTANCE_M);
  for(let attempt=0; attempt<SPAWN_REROLL_HARD_CAP; attempt++){
    const pt = pickSafeSpawnPoint(center, minM, cappedMax);
    if(haversineMeters(center.lat, center.lon, pt.lat, pt.lon) <= cappedMax) return pt;
  }
  // Never realistically reached — see the note above — but if it ever were, clamp straight onto
  // the boundary rather than either accepting an out-of-range point or spawning nothing at all.
  return clampPointToRadius(center, pickSafeSpawnPoint(center, minM, cappedMax), cappedMax);
}
// Keeps 2-3 ambient (common, "both"-pool) seeds alive within a strict 500m radius at all times.
// - A totally empty board (first load, or everything lost at once) refills its FULL target
//   instantly, guaranteed common+both species, so the player always sees exactly 2-3 seeds right
//   away — never just one instant spawn with the rest silently stuck behind a cooldown.
// - Losing a single seed out of an otherwise-populated board (collected, or expired on its own)
//   still queues a normal 20-30 min respawn cooldown, unchanged from before.
// (Out-of-bounds hygiene now lives in sweepOutOfBoundsSpawns(), called once per tick in
// mapWorldTick() ahead of this — any deficit it creates is picked up by the counting below exactly
// like a collected/expired seed would be.)
function ambientMaintenance(){
  if(!mapStateLoaded) return;
  const now = Date.now();
  const stillPending = [];
  state.mapRespawnQueue.forEach(item=>{
    if(now >= item.readyAt) spawnAmbientSeed();
    else stillPending.push(item);
  });
  state.mapRespawnQueue = stillPending;
  const ambientActiveAtStart = state.mapSpawns.filter(s=>s.kind==='ambient').length;
  const boardWasEmpty = ambientActiveAtStart === 0 && state.mapRespawnQueue.length === 0;
  let deficit = state.ambientTargetCount - ambientActiveAtStart - state.mapRespawnQueue.length;
  while(deficit > 0){
    if(boardWasEmpty){
      spawnAmbientSeed('common'); // guaranteed initial batch: common tier, "both" category
    } else {
      state.mapRespawnQueue.push({ readyAt: now + randBetween(RESPAWN_COOLDOWN_MIN_MS, RESPAWN_COOLDOWN_MAX_MS) });
    }
    deficit--;
  }
  saveMapStateDebounced();
}
function maybeFireSpecialSpawn(){
  const now = Date.now();
  if(!state.nextSpecialSpawnAt){ state.nextSpecialSpawnAt = now + randBetween(SPECIAL_INTERVAL_MIN_MS, SPECIAL_INTERVAL_MAX_MS); }
  if(now >= state.nextSpecialSpawnAt){
    spawnSpecialSeed();
    // Reschedule from "now" (rather than drifting off the missed timestamp) so a long-closed
    // app doesn't fire a burst of catch-up notifications.
    state.nextSpecialSpawnAt = now + randBetween(SPECIAL_INTERVAL_MIN_MS, SPECIAL_INTERVAL_MAX_MS);
    saveMapStateDebounced();
  }
}
// Strict 12h lifespan — checked against Date.now() so time drift (app backgrounded, laptop
// asleep, clock changes) can never leave a stale seed on the map.
function pruneExpiredSpawns(){
  const now = Date.now();
  const expired = state.mapSpawns.filter(s=> s.expiresAt && now >= s.expiresAt);
  if(!expired.length) return;
  expired.forEach(s=> removeSpawnMarker(s.uid));
  state.mapSpawns = state.mapSpawns.filter(s=> !(s.expiresAt && now >= s.expiresAt));
  saveMapStateDebounced();
}
// Single world tick: expiration -> ambient upkeep -> special-event check -> refresh what's on screen.
function mapWorldTick(){
  try{
    if(!mapStateLoaded) return;
    sweepOutOfBoundsSpawns();
    pruneExpiredSpawns();
    ambientMaintenance();
    maybeFireSpecialSpawn();
    if(state.tab === 'map' && leafletMapInstance){ syncSpawnMarkers(); updateRadarArrows(); updateProximityState(); }
  }catch(e){ console.error('Flora map world-tick error:', e); }
}
function collectWildSpawn(uid){
  const idx = state.mapSpawns.findIndex(s=>s.uid===uid);
  if(idx === -1) return;
  const spawn = state.mapSpawns[idx];
  const player = getPlayerCoords();
  const d = haversineMeters(player.lat, player.lon, spawn.lat, spawn.lon);
  if(d > COLLECT_RADIUS_M + GPS_JITTER_BUFFER_M){
    toast(`🚶 Too far — you're about ${Math.round(d)}m away. Get within ${COLLECT_RADIUS_M}m!`);
    return;
  }
  const key = spawn.key;
  state.pouch.push({uid: seedUid++, type: key});
  state.mapSpawns.splice(idx, 1);
  removeSpawnMarker(uid);
  if(inRangeSpawnUid === uid){ inRangeSpawnUid = null; hideHarvestPrompt(); }
  if(spawn.kind === 'ambient') ambientMaintenance();
  updateRadarArrows();
  updateProximityState(); // another spawn may already be in range — surface it immediately
  saveMapStateDebounced();
  playSfx('coin');
  try{ if(navigator.vibrate) navigator.vibrate([30,40,30]); }catch(e){ /* haptics unsupported, ignore */ }
  const isNew = checkDiscovery(key);
  if(isNew){ state.modal = 'newSpecies'; state.celebrateSpecies = key; render(); }
  else { showLeafToast(SEED_TYPES[key]); }
}

/* ---- Proximity collection: pulsing marker, slide-up harvest prompt, haptic on entering range ---- */
function showHarvestPrompt(spawn){
  const prompt = document.getElementById('harvestPrompt');
  const text = document.getElementById('harvestPromptText');
  if(!prompt) return;
  if(text) text.textContent = `Tap to Harvest ${SEED_TYPES[spawn.key].name}!`;
  prompt.classList.add('show');
}
function hideHarvestPrompt(){
  const prompt = document.getElementById('harvestPrompt');
  if(prompt) prompt.classList.remove('show');
}
function setMarkerInRange(uid, inRange){
  const marker = spawnMarkers[uid];
  const el = marker && marker.getElement ? marker.getElement() : null;
  if(!el) return;
  const mark = el.querySelector('.map-spawn-mark');
  if(mark) mark.classList.toggle('in-range', inRange);
}
// Finds the nearest spawn within COLLECT_RADIUS_M (if any) and syncs marker animation + the
// slide-up harvest button to it, firing a short haptic pulse only on the edge transition into range.
function updateProximityState(){
  if(!leafletMapInstance || state.tab !== 'map'){ if(inRangeSpawnUid){ inRangeSpawnUid = null; } hideHarvestPrompt(); return; }
  const player = getPlayerCoords();
  let nearest = null, nearestD = Infinity;
  state.mapSpawns.forEach(sp=>{
    const d = haversineMeters(player.lat, player.lon, sp.lat, sp.lon);
    if(d <= COLLECT_RADIUS_M && d < nearestD){ nearest = sp; nearestD = d; }
  });
  const newUid = nearest ? nearest.uid : null;
  if(newUid !== inRangeSpawnUid){
    if(inRangeSpawnUid) setMarkerInRange(inRangeSpawnUid, false);
    if(newUid){
      setMarkerInRange(newUid, true);
      showHarvestPrompt(nearest);
      try{ if(navigator.vibrate) navigator.vibrate(60); }catch(e){ /* haptics unsupported, ignore */ }
    } else {
      hideHarvestPrompt();
    }
    inRangeSpawnUid = newUid;
  } else if(newUid){
    // Same spawn still in range — re-apply the class in case syncSpawnMarkers rebuilt the marker.
    setMarkerInRange(newUid, true);
  }
}
// Cozy collection reward: leaf-particle burst + seed name, used for already-discovered finds.
// (Brand-new discoveries get the richer confetti "newSpecies" Dex-registration modal instead.)
function showLeafToast(type){
  const stack = document.getElementById('leafToastStack');
  if(!stack) return;
  while(stack.children.length >= 2){ stack.firstChild.remove(); }
  const el = document.createElement('div');
  el.className = 'leaf-toast';
  const leafEmojis = ['🍃','🌿','✨','🍀'];
  let particles = '';
  for(let i=0;i<6;i++){
    const angle = (Math.PI*2/6)*i + (Math.random()*0.5-0.25);
    const dist = 34 + Math.random()*22;
    const ex = Math.cos(angle)*dist, ey = Math.sin(angle)*dist - 10;
    const rot = Math.round(Math.random()*360 - 180);
    const emoji = leafEmojis[Math.floor(Math.random()*leafEmojis.length)];
    particles += `<span class="leaf-particle" style="--leaf-end:translate(${ex}px,${ey}px); --leaf-rot:${rot}deg; animation-delay:${(i*0.03).toFixed(2)}s;">${emoji}</span>`;
  }
  el.innerHTML = `${particles}<span class="leaf-toast-icon ${type.bg}">${seedIcon(type)}</span>
    <span class="leaf-toast-text"><span class="leaf-toast-title">${type.name}</span><span class="leaf-toast-sub">Added to pouch</span></span>`;
  stack.appendChild(el);
  setTimeout(()=> el.remove(), 2450);
}

/* ---- Off-screen radar: arrows pinned to the map edge pointing at seeds outside the 200m view ---- */
// Great-circle initial bearing (forward azimuth) from point 1 to point 2, in degrees clockwise
// from true north (0-360). This is the full, standard spherical bearing formula — every term is
// present and closed out; nothing here is abbreviated or left incomplete.
function computeBearing(lat1, lon1, lat2, lon2){
  if(![lat1, lon1, lat2, lon2].every(Number.isFinite)) return 0; // guard against bad/missing GPS data
  const toRad = deg => deg * Math.PI / 180;
  const phi1 = toRad(lat1);
  const phi2 = toRad(lat2);
  const deltaLon = toRad(lon2 - lon1);
  const y = Math.sin(deltaLon) * Math.cos(phi2);
  const x = (Math.cos(phi1) * Math.sin(phi2)) - (Math.sin(phi1) * Math.cos(phi2) * Math.cos(deltaLon));
  const thetaRad = Math.atan2(y, x);
  const thetaDeg = thetaRad * 180 / Math.PI;
  return (thetaDeg + 360) % 360;
}
// Finds where a ray from the center of a w×h box, travelling at compass bearing `bearingDeg`
// (0 = up/north, 90 = right/east, 180 = down/south, 270 = left/west — matching screen space
// exactly since the map is never rotated), intersects the box's edge (inset by `margin` px).
// Complete rectangle-ray intersection: handles every bearing, including the axis-aligned cases
// where dx or dy is exactly 0.
function edgePointForBearing(bearingDeg, w, h, margin){
  const rad = bearingDeg * Math.PI / 180;
  const dx = Math.sin(rad);
  const dy = -Math.cos(rad);
  const halfW = Math.max(w / 2 - margin, 1);
  const halfH = Math.max(h / 2 - margin, 1);
  const tX = dx !== 0 ? halfW / Math.abs(dx) : Infinity;
  const tY = dy !== 0 ? halfH / Math.abs(dy) : Infinity;
  const t = Math.min(tX, tY);
  return { x: (w / 2) + (dx * t), y: (h / 2) + (dy * t) };
}
// Location context for off-screen seeds: prefer a real nearby POI label (already fetched, free,
// instant); fall back to a throttled OpenStreetMap Nominatim reverse-geocode for a street/area
// name. Results are cached on the spawn itself (and persisted) so each spawn is only resolved once.
let nominatimQueue = Promise.resolve();
function nearestPOILabel(pt, maxM){
  let best = null, bestD = Infinity;
  state.mapPOIs.forEach(p=>{
    const d = haversineMeters(pt.lat, pt.lon, p.lat, p.lon);
    if(d < maxM && d < bestD){ best = p; bestD = d; }
  });
  return best ? best.label : null;
}
async function reverseGeocode(lat, lon){
  const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=17&addressdetails=1`;
  const ctrl = new AbortController();
  const timer = setTimeout(()=> ctrl.abort(), 6000);
  try{
    const res = await fetch(url, { signal: ctrl.signal, headers: {'Accept-Language':'en'} });
    clearTimeout(timer);
    if(!res.ok) throw new Error('Nominatim HTTP ' + res.status);
    const data = await res.json();
    const a = data.address || {};
    return a.road || a.pedestrian || a.footway || a.neighbourhood || a.suburb || a.hamlet || a.village || null;
  }catch(e){
    clearTimeout(timer);
    console.error('Flora reverse-geocode failed:', e);
    return null;
  }
}
function resolveSpawnLandmark(spawn){
  if(spawn.landmark || spawn.landmarkPending) return;
  const poiLabel = nearestPOILabel(spawn, 45);
  if(poiLabel){ spawn.landmark = poiLabel; saveMapStateDebounced(); return; }
  spawn.landmarkPending = true;
  // Nominatim's usage policy caps free reverse-geocoding at ~1 request/second, so every lookup is
  // serialized through this single queue rather than fired off in parallel per spawn.
  nominatimQueue = nominatimQueue.then(async ()=>{
    const label = await reverseGeocode(spawn.lat, spawn.lon);
    spawn.landmarkPending = false;
    spawn.landmark = label || 'a nearby spot';
    saveMapStateDebounced();
    if(state.tab === 'map' && leafletMapInstance) updateRadarArrows();
    await new Promise(r=> setTimeout(r, 1100));
  });
}
// Renders one edge-pinned directional arrow per off-screen seed, each pointing (via computeBearing,
// recomputed fresh from the player's current live coordinates every single call) toward its target,
// with distance and a real-world landmark/street name beneath it. Because this rebuilds its HTML
// from scratch on every call using getPlayerCoords() at call-time — never a cached/stale position —
// every arrow's rotation AND on-screen position both update together as the player physically walks.
// Fix: the radar distance labels used to be torn down and rebuilt from scratch on every call
// (via layer.innerHTML = ...), which made a smooth counter impossible — a brand new text node
// has no "previous value" to animate from. radarArrowEls keeps one persistent DOM node per
// off-screen spawn so its label can be stepped smoothly; radarMeterAnim tracks each label's
// currently-displayed value and in-flight timer.
let radarArrowEls = {};   // uid -> { wrap, shape, iconEl, label, landmark }
let radarMeterAnim = {};  // uid -> { current, target, dir, timer }
const METER_STEP_MS = 40;        // how often the displayed number moves by 1
const METER_SNAP_THRESHOLD_M = 60; // jumps bigger than this (e.g. first paint) snap instantly instead of crawling
// METER_HYSTERESIS_M requires a direction reversal to be at least this many meters before it's
// accepted as real; anything smaller is held at the last committed value instead of flickering.
// This is the ONLY smoothing applied to the meter's direction — it operates purely on the already
// -accurate position from getPlayerCoords() (GPS noise is filtered upstream of that, at the
// watchPosition callback itself), so a genuine, sustained meter of real movement is never held
// back by a dead zone; only an ambiguous few-meter wobble against the current trend is.
const METER_HYSTERESIS_M = 2;
function stepMeterLabel(uid, el, rawTargetValue){
  if(!el || !Number.isFinite(rawTargetValue)) return;
  let anim = radarMeterAnim[uid];
  if(!anim){ anim = { current: rawTargetValue, target: rawTargetValue, dir: 0, timer: null }; radarMeterAnim[uid] = anim; }
  const priorTarget = Number.isFinite(anim.target) ? anim.target : rawTargetValue;
  const delta = rawTargetValue - priorTarget;
  let nextTarget = rawTargetValue;
  if(delta !== 0 && anim.dir !== 0){
    const reversing = (delta > 0 ? 1 : -1) !== anim.dir;
    if(reversing && Math.abs(delta) < METER_HYSTERESIS_M) nextTarget = priorTarget; // small reversal — treat as noise, hold steady
  }
  if(nextTarget !== priorTarget) anim.dir = nextTarget > priorTarget ? 1 : -1;
  anim.target = nextTarget;
  if(Math.abs(anim.current - anim.target) > METER_SNAP_THRESHOLD_M) anim.current = anim.target;
  if(anim.timer) clearTimeout(anim.timer);
  const tick = ()=>{
    if(anim.current === anim.target){ el.textContent = anim.current + 'm'; anim.timer = null; return; }
    // Always exactly one meter per step — decreasing while closing in, increasing while pulling
    // away — so the number's direction of travel always matches the player's real motion.
    anim.current += anim.current < anim.target ? 1 : -1;
    el.textContent = anim.current + 'm';
    anim.timer = setTimeout(tick, METER_STEP_MS);
  };
  tick();
}
function updateRadarArrows(){
  if(!leafletMapInstance) return;
  const layer = document.getElementById('radarLayer');
  const scene = document.querySelector('.map-scene');
  if(!layer || !scene) return;
  const w = scene.clientWidth, h = scene.clientHeight;
  if(!w || !h) return;
  // Reads the same single source of truth as harvesting (getPlayerCoords() / state.mapLocation) —
  // no separate smoothed copy, so a real 1-meter step always shows up immediately; see the note
  // near METER_HYSTERESIS_M for how direction jitter is handled without introducing a dead zone.
  const player = getPlayerCoords();
  if(!Number.isFinite(player.lat) || !Number.isFinite(player.lon)) return;
  const offScreen = state.mapSpawns.filter(s=> haversineMeters(player.lat, player.lon, s.lat, s.lon) > VIEWPORT_RADIUS_M);
  const liveUids = new Set(offScreen.map(s=>s.uid));
  // Remove arrows for spawns that are no longer off-screen / no longer active.
  Object.keys(radarArrowEls).forEach(uid=>{
    if(!liveUids.has(uid)){
      radarArrowEls[uid].wrap.remove();
      delete radarArrowEls[uid];
      if(radarMeterAnim[uid]){ if(radarMeterAnim[uid].timer) clearTimeout(radarMeterAnim[uid].timer); delete radarMeterAnim[uid]; }
    }
  });
  offScreen.forEach(spawn=>{
    const dist = Math.round(haversineMeters(player.lat, player.lon, spawn.lat, spawn.lon));
    const bearing = computeBearing(player.lat, player.lon, spawn.lat, spawn.lon);
    const { x, y } = edgePointForBearing(bearing, w, h, 26);
    const type = SEED_TYPES[spawn.key];
    const icon = type.tierKey==='common' ? '🌱' : type.tierKey==='uncommon' ? '🌸' : type.tierKey==='rare' ? '💜' : type.tierKey==='epic' ? '✨' : '👑';
    if(!spawn.landmark && !spawn.landmarkPending) resolveSpawnLandmark(spawn);
    const landmarkText = spawn.landmark || 'locating…';
    let entry = radarArrowEls[spawn.uid];
    if(!entry){
      const wrap = document.createElement('div');
      wrap.className = 'radar-arrow';
      wrap.dataset.spawn = spawn.uid;
      wrap.innerHTML = `<div class="radar-arrow-shape spawn-${type.tierKey}">`
        + `<span class="radar-arrow-tip"></span><span class="radar-arrow-icon">${icon}</span></div>`
        + `<div class="radar-arrow-label"></div><div class="radar-arrow-landmark"></div>`;
      wrap.addEventListener('click', ()=>{
        const p = getPlayerCoords();
        const s = state.mapSpawns.find(x=>x.uid===spawn.uid);
        if(s) toast(`🧭 ${SEED_TYPES[s.key].name} is about ${Math.round(haversineMeters(p.lat, p.lon, s.lat, s.lon))}m away, near ${s.landmark || 'you'}.`);
      });
      layer.appendChild(wrap);
      entry = {
        wrap,
        shape: wrap.querySelector('.radar-arrow-shape'),
        iconEl: wrap.querySelector('.radar-arrow-icon'),
        label: wrap.querySelector('.radar-arrow-label'),
        landmark: wrap.querySelector('.radar-arrow-landmark')
      };
      radarArrowEls[spawn.uid] = entry;
      radarMeterAnim[spawn.uid] = { current: dist, target: dist, dir: 0, timer: null }; // first paint shows the exact value
      entry.label.textContent = dist + 'm';
    }
    entry.wrap.style.left = x + 'px';
    entry.wrap.style.top = y + 'px';
    entry.wrap.style.transform = 'translate(-50%,-50%)';
    entry.shape.style.transform = `rotate(${bearing}deg)`;
    if(entry.iconEl) entry.iconEl.style.transform = `rotate(${-bearing}deg)`;
    if(entry.landmark) entry.landmark.textContent = landmarkText;
    stepMeterLabel(spawn.uid, entry.label, dist);
  });
}

/* ---- Leaflet map lifecycle ---- */
async function initLeafletMap(){
  if(!mapPermissionsReady() || !document.getElementById('leafletMap')) return; // blank permission screen is showing instead — nothing to mount
  const myGeneration = ++mapGeneration;
  try{
    if(typeof L === 'undefined'){ console.error('Flora: Leaflet failed to load'); return; }
    const center = getPlayerCoords();
    leafletMapInstance = L.map('leafletMap', { zoomControl:false, attributionControl:true });
    // Camera is intentionally locked to the player -- no free panning or zooming.
    leafletMapInstance.dragging.disable();
    leafletMapInstance.touchZoom.disable();
    leafletMapInstance.doubleClickZoom.disable();
    leafletMapInstance.scrollWheelZoom.disable();
    leafletMapInstance.boxZoom.disable();
    leafletMapInstance.keyboard.disable();
    if(leafletMapInstance.tap) leafletMapInstance.tap.disable();
    // Voyager (not Positron/light_all) is used deliberately: it renders parks in soft pastel
    // green, water in soft blue, and roads with real width/casing out of the box — the
    // .leaflet-tile-pane filter above then just adds a light warm parchment wash on top,
    // instead of flattening the map into grayscale like the old Positron + heavy-sepia combo did.
    // BUG FIX (visible map edge after a short walk): Leaflet only keeps `keepBuffer` extra rings
    // of tiles loaded outside the current viewport (default 2), and by default only refreshes the
    // tile grid once panning/zooming is "idle". Because this map recenters itself programmatically
    // via setView() on every throttled GPS fix (dragging/zoom are disabled for the player), the
    // old defaults meant a short walk could outrun the pre-loaded ring and genuinely expose blank
    // map edge before the next tile row/column finished fetching. Raising keepBuffer widens that
    // pre-fetch/recycling margin well past a typical few-second walking distance between GPS
    // updates, and updateWhenIdle:false makes the grid keep pulling in new tiles continuously as
    // setView() moves the center, instead of waiting for movement to "stop" first.
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      maxZoom: 20, subdomains: 'abcd',
      keepBuffer: 8, updateWhenIdle: false, updateWhenZooming: true
    }).addTo(leafletMapInstance);
    // Fit to a ~200m window around the player, regardless of container/screen size.
    leafletMapInstance.fitBounds(boundsForRadius(center, VIEWPORT_RADIUS_M), {animate:false});
    // Tiles can render blank/clipped if the container size wasn't final at init time.
    leafletMapInstance.invalidateSize();
    setTimeout(()=>{ if(leafletMapInstance){ leafletMapInstance.invalidateSize(); updateRadarArrows(); } }, 150);

    const playerIcon = L.divIcon({
      className:'',
      html:`<div class="map-player-wrap"><span class="map-player-pulse"></span><div class="map-player-arrow" style="transform:rotate(${deviceHeading}deg)"><svg width="26" height="26" viewBox="0 0 26 26"><path d="M13 2 L20 22 L13 17 L6 22 Z" fill="var(--moss)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></div></div>`,
      iconSize:[30,30]
    });
    playerMarker = L.marker([center.lat, center.lon], {icon: playerIcon, interactive:false}).addTo(leafletMapInstance);
    if(compassEnabled) attachCompassListener();

    spawnMarkers = {};
    state.mapSpawns.forEach(addSpawnMarker);
    updateRadarArrows();
    updateProximityState();
    if(mapStateLoaded) mapWorldTick(); // catch up on expiration/respawn immediately when opening the tab

    // Real OSM POIs (cafes/parks/buildings/restaurants) softly bias where new spawns land, and
    // are also shown as decorative context markers. Safety zones (schools/hospitals/residential)
    // are fetched in parallel and are NEVER shown — they only gate spawn placement, see
    // isSafeSpawnPoint(). Both cover the full 1500m special-spawn radius.
    const [pois, zones] = await Promise.all([ loadNearbyPOIs(center), fetchSafetyZones(center) ]);
    if(myGeneration !== mapGeneration || !leafletMapInstance) return; // player left the tab mid-fetch
    state.mapPOIs = pois;
    safetyZones = zones;
    lastPOIFetchCenter = center;
    poiMarkers = state.mapPOIs.map(poi=>{
      const icon = L.divIcon({ className:'', html:`<div class="map-poi-icon poi-${poi.type}"><span>${poi.icon}</span></div>`, iconSize:[30,30] });
      const m = L.marker([poi.lat, poi.lon], {icon}).addTo(leafletMapInstance);
      m.on('click', ()=> toast(`📍 ${poi.label}`));
      return m;
    });
  }catch(e){ console.error('Flora map init error:', e); }
}
function destroyLeafletMap(){
  mapGeneration++; // invalidates any in-flight OSM POI fetch from this session
  detachCompassListener();
  try{
    // NOTE: navigator.geolocation.watchPosition is intentionally NOT cleared here. It is a
    // global background tracker (started in requestLocation) that must keep running regardless
    // of which tab is active — clearing it here was the bug that froze location tracking every
    // time the player navigated away from the map.
    if(leafletMapInstance){ leafletMapInstance.remove(); leafletMapInstance = null; }
    Object.values(spawnMarkers).forEach(m=>{ try{ m.remove(); }catch(e){ /* map already torn down, nothing to clean up */ } });
    poiMarkers.forEach(m=>{ try{ m.remove(); }catch(e){ /* map already torn down, nothing to clean up */ } });
    if(playerMarkerAnimFrame){ cancelAnimationFrame(playerMarkerAnimFrame); playerMarkerAnimFrame = null; }
    smoothedHeadingDeg = null; // reset the continuous rotation accumulator so the next marker's fresh paint and first smoothed update never disagree
    playerMarker = null; spawnMarkers = {}; poiMarkers = [];
    Object.values(radarMeterAnim).forEach(anim=>{ if(anim.timer) clearTimeout(anim.timer); });
    radarArrowEls = {};
    radarMeterAnim = {};
    lastPOIFetchCenter = null;
    inRangeSpawnUid = null;
    hideHarvestPrompt();
  }catch(e){ console.error('Flora map cleanup error:', e); }
}
function updatePlayerMarkerOnMap(){
  if(!leafletMapInstance || !playerMarker) return;
  const target = getPlayerCoords();
  const current = playerMarker.getLatLng();
  if(current.lat === target.lat && current.lng === target.lon) return; // already there — nothing to animate
  if(playerMarkerAnimFrame) cancelAnimationFrame(playerMarkerAnimFrame);
  // Glide from wherever the marker visually is right now (which may itself be mid-animation)
  // toward the new fix over PLAYER_MARKER_ANIM_MS, instead of Leaflet's default instant snap —
  // this is what makes the on-screen arrow move seamlessly across the map rather than teleporting
  // a few meters every time a throttled GPS update lands.
  playerMarkerAnimFrom = { lat: current.lat, lon: current.lng };
  playerMarkerAnimTo = target;
  playerMarkerAnimStart = performance.now();
  const step = (now)=>{
    const t = Math.min(1, (now - playerMarkerAnimStart) / PLAYER_MARKER_ANIM_MS);
    const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic — starts fast, settles gently into place
    playerMarker.setLatLng([
      playerMarkerAnimFrom.lat + (playerMarkerAnimTo.lat - playerMarkerAnimFrom.lat) * eased,
      playerMarkerAnimFrom.lon + (playerMarkerAnimTo.lon - playerMarkerAnimFrom.lon) * eased
    ]);
    if(t < 1) playerMarkerAnimFrame = requestAnimationFrame(step);
    else playerMarkerAnimFrame = null;
  };
  playerMarkerAnimFrame = requestAnimationFrame(step);
}
function addSpawnMarker(spawn){
  if(!leafletMapInstance) return;
  const type = SEED_TYPES[spawn.key];
  const specialClass = spawn.kind === 'special' ? ' spawn-special' : '';
  const icon = L.divIcon({
    className:'',
    html:`<div class="map-spawn-icon"><span class="map-spawn-pulse"></span><span class="map-spawn-mark spawn-${type.tierKey}${specialClass}">!</span></div>`,
    iconSize:[34,34]
  });
  const m = L.marker([spawn.lat, spawn.lon], {icon}).addTo(leafletMapInstance);
  m.on('click', ()=> collectWildSpawn(spawn.uid));
  spawnMarkers[spawn.uid] = m;
}
function removeSpawnMarker(uid){
  if(spawnMarkers[uid]){
    try{ spawnMarkers[uid].remove(); }catch(e){ console.error('Flora marker cleanup error:', e); }
  }
  delete spawnMarkers[uid];
}
function syncSpawnMarkers(){
  if(!leafletMapInstance) return;
  const liveUids = new Set(state.mapSpawns.map(s=>s.uid));
  Object.keys(spawnMarkers).forEach(uid=>{ if(!liveUids.has(uid)) removeSpawnMarker(uid); });
  state.mapSpawns.forEach(spawn=>{ if(!spawnMarkers[spawn.uid]) addSpawnMarker(spawn); });
}

/* ===================== RENDER ===================== */
function render(){
  try{
    document.getElementById('coinCount').textContent = fmt(state.coins);
    const lvlEl = document.getElementById('levelChip');
    if(lvlEl) lvlEl.textContent = `Lv ${state.level}`;
    document.querySelectorAll('.nav-btn').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.tab === state.tab);
    });
    const badge = document.getElementById('dexBadge');
    if(badge) badge.style.display = state.dexHasUnseenDiscovery ? 'block' : 'none';

    const content = document.getElementById('content');
    const leavingMap = lastRenderedTab === 'map' && state.tab !== 'map';
    if(leavingMap){
      destroyLeafletMap();
      // BUG FIX (meters "locked" behind an active walk session): a screen-wake lock was
      // previously only ever requested inside toggleWalkSession(), so leaving the phone idle on
      // the Map tab WITHOUT an explicit walk session running let the screen dim/sleep, which in
      // turn throttles/pauses the GPS watchPosition callbacks and timers that drive the radar and
      // proximity meters — from the player's perspective the meters simply stopped updating
      // unless a walk session had been started. The map tab itself now holds its own wake lock
      // (independent of state.walkActive) for as long as it's open; only release it here if a
      // walk session isn't ALSO separately relying on it staying held.
      if(!state.walkActive) releaseWakeLock();
    }

    const stayingOnMap = state.tab === 'map' && lastRenderedTab === 'map' && leafletMapInstance;
    if(state.tab === 'garden') content.innerHTML = renderGarden();
    else if(state.tab === 'map'){
      if(!stayingOnMap){
        content.innerHTML = renderMap();
        setTimeout(initLeafletMap, 0);
        if(!wakeLockSentinel) requestWakeLock(); // see BUG FIX note above — keeps GPS/meters live while the map tab is open
      } else {
        const chip = document.getElementById('mapLocChip');
        if(chip) chip.textContent = mapLocationText();
        // BUG FIX (walk button state toggle): the fast-path taken while staying on the Map tab
        // used to skip re-generating the controls row entirely, so this button's label/style never
        // actually updated on screen after a tap — state.walkActive WAS toggling correctly
        // underneath, the button DOM node just never got told about it. Update it directly here.
        const walkBtnEl = document.getElementById('walkSessionBtn');
        if(walkBtnEl){
          walkBtnEl.textContent = state.walkActive ? '⏹️ End Walk Session' : '🚶 Start Walk Session';
          walkBtnEl.classList.toggle('gold', state.walkActive);
          walkBtnEl.classList.toggle('soft', !state.walkActive);
        }
        syncSpawnMarkers();
        updatePlayerMarkerOnMap();
        updateRadarArrows();
        updateProximityState();
      }
    }
    else if(state.tab === 'dex') content.innerHTML = renderDex();
    else content.innerHTML = renderPouch();

    lastRenderedTab = state.tab;
    renderModal();
  }catch(err){
    console.error('Flora render error:', err);
  }
}

/* ===================== PLANT SVG (staged growth, species color transitions) ===================== */
function stemPathD(stemH, shape){
  if(shape === 'vine') return `M46 66 C 30 ${66-stemH*0.42}, 62 ${66-stemH*0.62}, 45 ${66-stemH}`;
  return `M46 66V${66-stemH}`;
}
function bloomSVG(type, stemH){
  const flY = 66 - stemH;
  if(type.shape === 'vine'){
    const spots = [ [45, flY], [34, flY+16], [56, flY+9] ];
    let clusters = '';
    spots.forEach(([cx,cy])=>{
      let petals = '';
      for(let p=0;p<5;p++){
        const ang = (Math.PI*2/5)*p;
        const px = cx + Math.cos(ang)*5.5, py = cy + Math.sin(ang)*5.5;
        petals += `<ellipse cx="${px}" cy="${py}" rx="4" ry="3" fill="${type.petal}" stroke="${type.center}" stroke-width="0.8" transform="rotate(${ang*180/Math.PI} ${px} ${py})"/>`;
      }
      clusters += `<g>${petals}<circle cx="${cx}" cy="${cy}" r="2.6" fill="${type.center}"/></g>`;
    });
    return `${clusters}<circle cx="34" cy="${flY-10}" r="1.6" fill="#CFF3F1" style="animation: sparkle 1.6s ease-in-out infinite;"/><circle cx="58" cy="${flY-2}" r="1.3" fill="#CFF3F1" style="animation: sparkle 1.6s ease-in-out infinite 0.5s;"/>`;
  }
  if(type.shape === 'radiant'){
    let rays = '';
    for(let r=0;r<10;r++){
      const ang = (Math.PI*2/10)*r;
      const x1 = 46 + Math.cos(ang)*13, y1 = flY + Math.sin(ang)*13;
      const x2 = 46 + Math.cos(ang)*20, y2 = flY + Math.sin(ang)*20;
      rays += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${type.petal}" stroke-width="2" stroke-linecap="round" opacity="0.55"/>`;
    }
    let petals = '';
    const count = type.petals || 8;
    for(let p=0;p<count;p++){
      const ang = (Math.PI*2/count)*p;
      const px = 46 + Math.cos(ang)*11, py = flY + Math.sin(ang)*11;
      petals += `<ellipse cx="${px}" cy="${py}" rx="7.5" ry="5.2" fill="${type.petal}" stroke="${type.center}" stroke-width="1" transform="rotate(${ang*180/Math.PI} ${px} ${py})"/>`;
    }
    return `<circle cx="46" cy="${flY}" r="19" fill="${type.petal}" opacity="0.18" style="animation: pulseRing 2.2s ease-in-out infinite;"/>${rays}${petals}<circle cx="46" cy="${flY}" r="6" fill="${type.center}"/><circle cx="46" cy="${flY}" r="6" fill="none" stroke="#fff" stroke-width="1" opacity="0.6"/>`;
  }
  const count = type.petals || 6;
  let petals = '';
  for(let p=0;p<count;p++){
    const ang = (Math.PI*2/count)*p;
    const px = 46 + Math.cos(ang)*10, py = flY + Math.sin(ang)*10;
    petals += `<ellipse cx="${px}" cy="${py}" rx="6.5" ry="4.5" fill="${type.petal}" stroke="${type.center}" stroke-width="1" transform="rotate(${ang*180/Math.PI} ${px} ${py})"/>`;
  }
  return `<g>${petals}<circle cx="46" cy="${flY}" r="5" fill="${type.center}"/></g><g opacity="0.9"><circle cx="28" cy="${flY-14}" r="2" fill="#F5D68C" style="animation: sparkle 1.6s ease-in-out infinite;"/><circle cx="64" cy="${flY-6}" r="1.6" fill="#F5D68C" style="animation: sparkle 1.6s ease-in-out infinite 0.4s;"/><circle cx="52" cy="${flY-20}" r="1.4" fill="#F5D68C" style="animation: sparkle 1.6s ease-in-out infinite 0.8s;"/></g>`;
}
function plantSVG(potState){
  if(!potState){
    return `<svg width="104" height="34" viewBox="0 0 92 30"><circle cx="46" cy="15" r="13" fill="none" stroke="#B8834F" stroke-width="2.2" stroke-dasharray="4 4"/><path d="M46 9V21M40 15H52" stroke="#B8834F" stroke-width="2.4" stroke-linecap="round"/></svg>`;
  }
  const type = SEED_TYPES[potState.type];
  const frac = Math.min(1, potState.progress / type.threshold);
  const ready = frac >= 1;
  const stemH = 6 + frac*46;
  const leafCount = frac < 0.15 ? 0 : frac < 0.45 ? 2 : frac < 0.75 ? 4 : 4;
  const sway = ready ? 'style="animation: sway 2.6s ease-in-out infinite; transform-origin: 46px 66px;"' : '';
  let leaves = '';
  const leafPositions = [0.35, 0.55, 0.75, 0.9];
  for(let i=0;i<leafCount;i++){
    const t = leafPositions[i];
    const y = 66 - stemH*t;
    const side = i % 2 === 0 ? -1 : 1;
    const lx = 46 + side*3;
    leaves += `<path d="M${lx} ${y} Q${lx + side*16} ${y-6} ${lx + side*4} ${y-16} Q${lx+side*2} ${y-8} ${lx} ${y}Z" fill="${LEAF_GREEN}" stroke="#3F5A38" stroke-width="1" stroke-linejoin="round"/>`;
  }
  let bloom = '';
  if(frac >= 0.75 && frac < 1){
    const budY = 66 - stemH;
    const budT = Math.min(1, (frac-0.75)/0.25);
    const budColor = lerpColor(LEAF_GREEN, type.petal, budT);
    const budR = 3.5 + frac*3;
    bloom = `
      <path d="M${46-budR*0.9} ${budY+budR*0.5} Q46 ${budY+budR*1.7} ${46+budR*0.9} ${budY+budR*0.5}" fill="${LEAF_GREEN}" opacity="0.9"/>
      <ellipse cx="46" cy="${budY}" rx="${budR*0.75}" ry="${budR}" fill="${budColor}" stroke="${type.center}" stroke-width="1"/>`;
  } else if(ready){
    bloom = bloomSVG(type, stemH);
  } else if(frac < 0.15){
    bloom = `<path d="M42 63 Q46 58 50 63" stroke="${LEAF_GREEN}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  }
  return `<svg width="122" height="94" viewBox="0 0 92 70" ${sway}><path d="${stemPathD(stemH, type.shape)}" stroke="#4A6B42" stroke-width="3" fill="none" stroke-linecap="round"/>${leaves}${bloom}</svg>`;
}

/* ===================== POT RENDERING (fixed shelf anchor, tap-to-inspect) ===================== */
function potVisualInner(potState){
  const ready = potState && (potState.progress >= SEED_TYPES[potState.type].threshold);
  // BUG FIX (pot growth layering, refined): putting the whole plant in front of the whole pot
  // (an earlier pass) fixed the pot fully hiding the plant at early growth, but overcorrected —
  // the bottom of the stem then visibly floated ON TOP of the pot's soil/rim instead of looking
  // like it emerges from inside it. Correct three-layer stacking instead: (1) BACK layer — the
  // tall front wall, shadow, rim and soil, all behind the plant, so the wall can never hide the
  // stem/leaves/flower at any growth stage; (2) the PLANT in the middle; (3) a FRONT layer that
  // re-draws ONLY the rim + soil silhouette (no tall wall) on top of the plant. Because layer 3 is
  // pixel-identical to the rim/soil already drawn in layer 1, it seams invisibly and simply "hugs"
  // back over whatever part of the stem's base falls within the opening — tucking the bottom of
  // the plant into the pot — while anything taller than the rim (the growing stem/leaves/flower)
  // still reads clearly in front, since it extends outside that ellipse's silhouette.
  return `
    ${ready ? `<div class="ready-badge">✨ Ready!</div>` : ''}
    <svg width="101" height="65" viewBox="0 0 88 58" style="position:absolute; left:50%; bottom:0; transform:translateX(-50%); z-index:1;">
      <ellipse cx="44" cy="14" rx="34" ry="7" fill="#3a2a1c" opacity="0.18"/>
      <path d="M10 12 L18 54 Q44 60 70 54 L78 12 Z" fill="var(--terracotta)" stroke="var(--terracotta-dark)" stroke-width="2" stroke-linejoin="round"/>
      <ellipse cx="44" cy="12" rx="34" ry="8" fill="var(--terracotta-rim)" stroke="var(--terracotta-dark)" stroke-width="2"/>
      <ellipse cx="44" cy="12" rx="27" ry="5" fill="#5C4028"/>
      <path d="M18 30 Q44 34 70 30" stroke="var(--terracotta-dark)" stroke-width="1.4" fill="none" opacity="0.5"/>
    </svg>
    <div style="position:absolute; left:50%; bottom:29px; transform:translateX(-50%); z-index:2;">${plantSVG(potState)}</div>
    <svg width="101" height="65" viewBox="0 0 88 58" style="position:absolute; left:50%; bottom:0; transform:translateX(-50%); z-index:3; pointer-events:none;" aria-hidden="true">
      <ellipse cx="44" cy="12" rx="34" ry="8" fill="var(--terracotta-rim)" stroke="var(--terracotta-dark)" stroke-width="2"/>
      <ellipse cx="44" cy="12" rx="27" ry="5" fill="#5C4028"/>
    </svg>
  `;
}
function potSVG(index, potState, pos, scale){
  const type = potState ? SEED_TYPES[potState.type] : null;
  const style = pos ? `left:${pos.left}%; bottom:${pos.bottom}px;` : '';
  return `
  <div class="pot-slot" data-pot="${index}" style="${style}">
    <div class="pot-slot-scale" style="transform:scale(${scale||1});">
      <div class="pot-visual" id="potVisual${index}">${potVisualInner(potState)}</div>
      <div class="pot-label">${potState ? type.name : 'Tap to plant'}</div>
    </div>
  </div>`;
}
function animatePotGrowth(index, fromProgress, toProgress){
  const p = activePots()[index];
  if(!p) return;
  const stepSize = 100;
  let interim = fromProgress;
  function tick(){
    interim = Math.min(toProgress, interim + stepSize);
    const el = document.getElementById('potVisual'+index);
    if(el){ el.innerHTML = potVisualInner({...p, progress: interim}); }
    if(interim < toProgress){ setTimeout(tick, 90); }
  }
  tick();
}

function skyDecoSVG(weather){
  const showSun = weather === 'sunny';
  const cloudOpacity = weather === 'cloudy' ? 0.95 : weather === 'sunny' ? 0.85 : 0.55;
  return `<svg class="sky-deco" viewBox="0 0 400 260" preserveAspectRatio="none" width="100%" height="260">
    ${showSun ? `<circle cx="335" cy="50" r="26" fill="#F7E2A8" opacity="0.9"/>` : ''}
    <g style="animation: floatCloud 6s ease-in-out infinite alternate;"><ellipse cx="72" cy="58" rx="32" ry="14" fill="#ffffff" opacity="${cloudOpacity}"/><ellipse cx="102" cy="50" rx="22" ry="12" fill="#ffffff" opacity="${cloudOpacity}"/></g>
    <g style="animation: floatCloud 8s ease-in-out infinite alternate-reverse;"><ellipse cx="230" cy="74" rx="26" ry="11" fill="#ffffff" opacity="${cloudOpacity*0.8}"/></g>
  </svg>`;
}
function weatherLayerSVG(weather){
  if(weather === 'rainy'){
    let drops = '';
    for(let i=0;i<16;i++){
      const x = (i*26)%400 + (i%3)*6;
      const delay = (i%7)*0.13;
      drops += `<line x1="${x}" y1="0" x2="${x-7}" y2="22" stroke="#8FB4C9" stroke-width="2" stroke-linecap="round" opacity="0.55" style="animation: rainFall 0.85s linear infinite; animation-delay:${delay}s;"/>`;
    }
    return `<svg class="weather-layer" viewBox="0 0 400 300" preserveAspectRatio="none" width="100%" height="300">${drops}</svg>`;
  }
  if(weather === 'snowy'){
    let flakes = '';
    for(let i=0;i<18;i++){
      const x = (i*23)%400 + (i%4)*5;
      const delay = (i%8)*0.4;
      const r = 2 + (i%3);
      flakes += `<circle cx="${x}" cy="0" r="${r}" fill="#fff" opacity="0.85" style="animation: snowFall ${3+(i%3)}s linear infinite; animation-delay:${delay}s;"/>`;
    }
    return `<svg class="weather-layer" viewBox="0 0 400 300" preserveAspectRatio="none" width="100%" height="300">${flakes}</svg>`;
  }
  if(weather === 'cloudy'){
    return `<svg class="weather-layer" viewBox="0 0 400 300" preserveAspectRatio="none" width="100%" height="300">
      <ellipse cx="130" cy="66" rx="55" ry="22" fill="#bdb8a8" opacity="0.4"/>
      <ellipse cx="280" cy="90" rx="62" ry="24" fill="#b3ada0" opacity="0.35"/>
    </svg>`;
  }
  return '';
}

function confettiDots(){
  const colors=['#E3AC3D','#DE8D95','#9C82C4','#4FA0A8','#8CAE7D'];
  let out='';
  for(let i=0;i<14;i++){
    const left = (i*7)%100;
    const color = colors[i%colors.length];
    const delay = (i%6)*0.12;
    out += `<div style="position:absolute; top:-10px; left:${left}%; width:6px; height:6px; background:${color}; border-radius:2px; animation: confettiFall 1.4s ease-in forwards; animation-delay:${delay}s;"></div>`;
  }
  return out;
}

/* ===================== SWIPE-TO-TEAR ===================== */
function setupTearInteraction(){
  if(tearCleanup){ tearCleanup(); tearCleanup = null; }
  const stage = document.getElementById('tearStage');
  const leftHalf = document.getElementById('packLeft');
  const rightHalf = document.getElementById('packRight');
  const hint = document.getElementById('swipeHint');
  if(!stage) return;
  let startX = null, dragging = false, done = false;
  const threshold = 65;
  function onDown(e){
    dragging = true; done = false;
    startX = (e.touches ? e.touches[0].clientX : e.clientX);
    if(hint) hint.style.opacity = '0';
  }
  function onMove(e){
    if(!dragging || done) return;
    const x = (e.touches ? e.touches[0].clientX : e.clientX);
    const dx = x - startX;
    const progress = Math.max(0, Math.min(1, Math.abs(dx)/threshold));
    if(leftHalf) leftHalf.style.transform = `translate(${-dx*0.4}px, ${progress*4}px) rotate(${-progress*16}deg)`;
    if(rightHalf) rightHalf.style.transform = `translate(${dx*0.4}px, ${-progress*4}px) rotate(${progress*16}deg)`;
    if(progress >= 1){ done = true; completeTear(leftHalf, rightHalf); }
  }
  function onUp(){
    dragging = false;
    if(!done){
      if(leftHalf) leftHalf.style.transform = '';
      if(rightHalf) rightHalf.style.transform = '';
      if(hint) hint.style.opacity = '1';
    }
  }
  stage.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  tearCleanup = ()=>{
    stage.removeEventListener('pointerdown', onDown);
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  };
}
function completeTear(leftHalf, rightHalf){
  if(leftHalf) leftHalf.style.transform = 'translate(-70px, 10px) rotate(-28deg)';
  if(rightHalf) rightHalf.style.transform = 'translate(70px, -12px) rotate(26deg)';
  playSfx('pack');
  if(tearCleanup){ tearCleanup(); tearCleanup = null; }
  setTimeout(()=>{
    state.modal = 'burst';
    render();
    setTimeout(()=>{ state.modal = 'reveal'; render(); }, 550);
  }, 220);
}

/* ===================== ACTIONS ===================== */
// Shared walking-progression loop: applies `n` steps to totalSteps and every potted seed's
// growth, checks for a level-up, and re-renders/animates as appropriate. Used by both the
// existing debug "+500 steps" button and the new real accelerometer-driven step counter, so
// real walking drives the exact same seed growth / distance tracking / leveling logic.
function addSteps(n){
  state.totalSteps += n;
  const activeId = activeRoomId();
  const allReadyEvents = []; // across every room — used for the "ready to harvest" toast
  const growthUpdates = [];  // active room only — used to animate the currently-visible pots
  ROOMS.forEach(room=>{
    state.roomPots[room.id] = state.roomPots[room.id].map((p,i)=>{
      if(!p) return p;
      const type = SEED_TYPES[p.type];
      const newProgress = Math.min(type.threshold, p.progress + n);
      if(newProgress > p.progress){
        const update = {index:i, from:p.progress, to:newProgress, threshold:type.threshold};
        allReadyEvents.push(update);
        if(room.id === activeId) growthUpdates.push(update);
      }
      return {...p, progress:newProgress};
    });
  });
  const leveled = checkLevelUp();
  if(state.tab === 'garden' && !state.modal){
    growthUpdates.forEach(u=> animatePotGrowth(u.index, u.from, u.to));
  } else {
    render();
  }
  return { growthUpdates: allReadyEvents, leveled };
}
function simulateSteps(){
  const { growthUpdates, leveled } = addSteps(500);
  if(!leveled){
    const anyReady = growthUpdates.some(u=> u.to >= u.threshold && u.from < u.threshold);
    if(anyReady) toast('🌼 A plant is ready to harvest!');
    else if(growthUpdates.length) toast('+500 steps — your garden is growing!');
    else toast('+500 steps logged');
  }
}

// Streamlined planting flow: an empty pot is the ONLY place a plant request can start from.
// Tapping it stores exactly which pot (room + index) is waiting, then sends the player straight to
// the Pouch to choose a seed — there is no seed-picker in the garden view anymore, and the Pouch's
// own "Plant" buttons only work while a pot is actually waiting (see plant-request's handler),
// closing off the old redundant "plant from either screen" path entirely.
function requestPlantForPot(index){
  state.activePotId = { roomIndex: state.currentRoom, potIndex: index };
  state.tab = 'pouch';
  toast('🌱 Pick a seed below to plant it in that pot!');
  render();
}
function openPotInspect(index){
  state.inspectPotIndex = index;
  state.modal = 'potInspect';
  render();
}

function plantSeed(uid){
  if(!state.activePotId){ toast('🪴 Tap an empty pot in your garden first!'); return; }
  const room = ROOMS[state.activePotId.roomIndex];
  const pots = state.roomPots[room.id];
  const idx = state.activePotId.potIndex;
  if(pots[idx]){ state.activePotId = null; toast('That pot already has something growing!'); render(); return; } // defensive: pot filled by another path since the request was made
  if(uid === 'free-common'){
    pots[idx] = {uid:'free-common', type:'common', progress:0};
  } else {
    const pIdx = state.pouch.findIndex(s=> String(s.uid) === String(uid));
    if(pIdx === -1) return;
    const item = state.pouch[pIdx];
    pots[idx] = {uid: item.uid, type: item.type, progress:0};
    state.pouch.splice(pIdx,1);
  }
  state.currentRoom = state.activePotId.roomIndex;
  state.activePotId = null;
  state.tab = 'garden';
  playSfx('plant');
  toast(`🌱 Planted in ${room.name}!`);
  render();
}

function harvestPot(index){
  const p = activePots()[index];
  if(!p) return;
  const type = SEED_TYPES[p.type];
  if(p.progress < type.threshold) return;
  state.coins += type.harvest;
  state.totalCoinsEarned += type.harvest;
  state.totalHarvested += 1;
  state.dex[p.type] = (state.dex[p.type] || 0) + 1;
  activePots()[index] = null;
  playSfx('harvest');
  toast(`Harvested! +${type.harvest}¢`);
}

function requestCompost(uid){
  state.compostTargetUid = uid;
  state.modal = 'compostConfirm';

function confirmCompostAnimated(){
  const uid = state.compostTargetUid;
  state.modal = null;

  requestAnimationFrame(()=> animateCompostFly(uid));
}
function animateCompostFly(uid){
  const item = state.pouch.find(s=> String(s.uid) === String(uid));
  if(!item) return;
  const type = SEED_TYPES[item.type];
  const sourceEl = document.querySelector(`.seed-card[data-seed-uid="${uid}"] .seed-icon-wrap`);
  const target = document.getElementById('composterCorner');
  const phoneEl = document.getElementById('phone');
  if(sourceEl && target && phoneEl){
    const startRect = sourceEl.getBoundingClientRect();
    const endRect = target.getBoundingClientRect();
    const phoneRect = phoneEl.getBoundingClientRect();
    const flyEl = sourceEl.cloneNode(true);
    flyEl.style.position='absolute';
    flyEl.style.left=(startRect.left-phoneRect.left)+'px';
    flyEl.style.top=(startRect.top-phoneRect.top)+'px';
    flyEl.style.width=startRect.width+'px';
    flyEl.style.height=startRect.height+'px';
    flyEl.style.margin='0'; flyEl.style.zIndex='80';
    flyEl.style.transition='transform 0.55s cubic-bezier(.4,0,.2,1), opacity 0.55s ease';
    flyEl.style.pointerEvents='none';
    phoneEl.appendChild(flyEl);
    requestAnimationFrame(()=>{
      const dx=(endRect.left+endRect.width/2)-(startRect.left+startRect.width/2);
      const dy=(endRect.top+endRect.height/2)-(startRect.top+startRect.height/2);
      flyEl.style.transform=`translate(${dx}px, ${dy}px) scale(0.2)`;
      flyEl.style.opacity='0.15';
    });
    setTimeout(()=>{ flyEl.remove(); finalizeCompost(uid, type); }, 580);
  } else {
    finalizeCompost(uid, type);
  }
}
function finalizeCompost(uid, type){
  const idx = state.pouch.findIndex(s=> String(s.uid) === String(uid));
  if(idx !== -1) state.pouch.splice(idx,1);
  state.coins += type.compost;
  state.totalCoinsEarned += type.compost;
  playSfx('coin');
  toast(`Composted for +${type.compost}¢`);
  render();
  const bumpEl = document.getElementById('composterCorner');
  if(bumpEl){ bumpEl.classList.add('bump'); setTimeout(()=> bumpEl.classList.remove('bump'), 500); }
}
